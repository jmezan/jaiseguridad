<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estado de tu solicitud</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#EEF1F2;--sf:#fff;--ink:#14202B;--mut:#5B6B77;--ln:#D2DADF;--ac:#0F7C7E;--acx:#fff;--wr:#B7660B;--ok:#1E7A46}
@media (prefers-color-scheme:dark){:root{--bg:#0E161D;--sf:#17222B;--ink:#E7EDF0;--mut:#93A3AE;--ln:#2A3A46;--ac:#3DB8BA;--acx:#0E161D;--wr:#E8A33D;--ok:#55C283}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:560px;margin:auto;padding:16px}
h1{font-size:1.4rem;margin:12px 0 4px}p{margin:0 0 12px;color:var(--mut)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:6px;padding:12px 16px;font:600 16px system-ui;cursor:pointer;margin-top:16px;width:100%}
.btn:disabled{opacity:.6}
.btn.alt{background:none;color:var(--ac);border:1px solid var(--ac);margin-top:10px}
.btn.danger{background:none;color:var(--wr);border:1px solid var(--wr);margin-top:10px}
.btn.dangerfill{background:var(--wr);color:#fff}
a{color:var(--ac)}
.steps{list-style:none;margin:16px 0 0;padding:0}
.steps li{display:flex;gap:10px;align-items:center;padding:6px 0;color:var(--mut)}
.steps li::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--ln);flex:none}
.steps li.done{color:var(--ink)}.steps li.done::before{background:var(--ac);border-color:var(--ac)}
.steps li.now{font-weight:700;color:var(--ink)}
.err{border-color:var(--wr)}.okc{border-color:var(--ok)}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slots button{padding:8px 12px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.slots button[aria-pressed=true]{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.slots button:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.acc{margin-top:16px;padding-top:4px;border-top:1px solid var(--ln)}
.msg{margin-bottom:14px;padding:12px;border-radius:8px;border:1px solid var(--ln);background:var(--sf)}
</style>
</head>
<body>
<main>
<h1>Estado de tu solicitud</h1>
<p>Ingresá tu número de ticket y el teléfono con el que hiciste el pedido.</p>
<div class="card">
<label for="tk">Número de ticket</label><input id="tk" inputmode="numeric" placeholder="1011">
<label for="tl">Teléfono</label><input id="tl" type="tel" autocomplete="tel" placeholder="11 5555 1234">
<button class="btn" id="go">Consultar</button>
</div>
<div id="out" aria-live="polite"></div>
<p><a href="index.html">← Volver al inicio</a> · <a href="solicitar.html">Hacer una nueva solicitud</a></p>
</main>
<script>
const sb = supabase.createClient('https://vrgkfaueuszwmocdnylw.supabase.co', 'sb_publishable_F134Y7czJn-F5r1BWR3oRQ_arEXKV2M');
const $ = i => document.getElementById(i);
const PASOS = ['Solicitud recibida', 'Visita confirmada', 'Técnico en camino', 'Visita completada'];
const IDX = { pendiente: 0, agendada: 1, en_camino: 2, completada: 3 };
const TXT = {
  pendiente: 'Nuestros especialistas están revisando tu solicitud. Te la confirmaremos con un nuevo mensaje.',
  agendada: 'Tu visita está confirmada.',
  en_camino: 'Tu técnico va en camino.',
  completada: 'La visita fue completada. ¡Gracias por confiar en nosotros!',
  cancelada: 'Esta solicitud fue cancelada. Si querés una nueva visita, podés pedirla desde el portal.'
};
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = t => t.slice(0, 5).replace(/^0/, '');
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
let ctx = null, pick = null;   // ticket y teléfono de la consulta actual; franja elegida al reprogramar

function show(html, cls, aviso) {
  $('out').innerHTML = (aviso ? '<div class="msg okc"></div>' : '') + '<div class="card' + (cls ? ' ' + cls : '') + '">' + html + '</div>';
  if (aviso) $('out').firstChild.textContent = aviso;
}
async function llamar(fn, body) {
  const { data, error } = await sb.functions.invoke(fn, { body });
  let msg = data?.error;
  if (error && !msg) { try { msg = (await error.context.json()).error; } catch (e) {} }
  if (msg || error || !data) throw new Error(msg || 'No pudimos completar la operación. Intentá de nuevo.');
  return data;
}
function render(data, aviso) {
  const f = data.fecha.split('-').reverse().join('/');
  let h = '<b>Ticket #' + esc(data.ticket) + '</b> · ' + esc(data.servicio) + '<br><span style="color:var(--mut)">Fecha: ' + f + ' · Horario: ' + esc(data.franja) + (data.tecnico ? ' · Técnico: ' + esc(data.tecnico) : '') + '</span>';
  h += '<p style="margin:12px 0 0;color:var(--ink)">' + esc(TXT[data.estado] || '') + '</p>';
  if (data.estado !== 'cancelada') {
    const n = IDX[data.estado] ?? 0;
    h += '<ul class="steps">' + PASOS.map((p, i) => '<li class="' + (i < n ? 'done' : i === n ? 'done now' : '') + '">' + p + '</li>').join('') + '</ul>';
  }
  if (data.puede_reprogramar || data.puede_cancelar || data.aviso_cambio) {
    h += '<div class="acc" id="acc">';
    if (data.puede_reprogramar) h += '<button class="btn alt" data-a="repro">Reprogramar la visita</button>';
    if (data.puede_cancelar) h += '<button class="btn danger" data-a="cancel">Cancelar la solicitud</button>';
    if (data.aviso_cambio) h += '<p style="margin:12px 0 0;font-size:.9rem">' + esc(data.aviso_cambio) + '</p>';
    h += '</div>';
  }
  show(h, '', aviso);
  $('out').dataset.estado = JSON.stringify({ ticket: data.ticket });
  window._data = data;
}
async function consultar(aviso) {
  const { data, error } = await sb.functions.invoke('consultar-estado', { body: ctx });
  let msg = data?.error;
  if (error && !msg) { try { msg = (await error.context.json()).error; } catch (e) {} }
  if (msg || error || !data) return show(esc(msg || 'No pudimos consultar el estado. Intentá de nuevo.'), 'err');
  render(data, aviso);
}
$('go').onclick = async () => {
  if (!$('tk').value.trim() || !$('tl').value.trim()) return show('Ingresá tu número de ticket y tu teléfono.', 'err');
  $('go').disabled = true; show('Consultando…');
  ctx = { ticket: $('tk').value, telefono: $('tl').value };
  await consultar();
  $('go').disabled = false;
};

// ---- Reprogramar ----
function dias() {
  const o = [], d = new Date();
  while (o.length < 10) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) o.push(new Date(d)); }
  return o;
}
async function cargarFranjas() {
  pick = null; $('conf').disabled = true;
  $('slots').textContent = 'Cargando horarios…';
  const { data, error } = await sb.rpc('available_slots', { d: $('dia').value });
  if (error) { $('slots').textContent = 'No pudimos cargar los horarios. Recargá la página.'; return; }
  $('slots').innerHTML = (data || []).map(s => '<button type="button" data-h="' + s.slot.slice(0, 5) + '" aria-pressed="false" ' + (s.free < 1 ? 'disabled' : '') + '>' + fmt(s.slot) + ' a ' + fmt(s.fin) + '</button>').join('') || 'Sin horarios para este día.';
}
function abrirRepro() {
  $('acc').innerHTML = '<label for="dia">Nuevo día</label><select id="dia">' +
    dias().map(d => '<option value="' + iso(d) + '">' + esc(d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' })) + '</option>').join('') +
    '</select><label>Franja horaria disponible</label><div class="slots" id="slots"></div>' +
    '<p style="margin:10px 0 0;font-size:.9rem">Al cambiar el horario, nuestros especialistas vuelven a revisar la visita y te la confirmamos con un nuevo mensaje.</p>' +
    '<button class="btn" id="conf" data-a="confirmar" disabled>Confirmar nuevo horario</button><button class="btn alt" data-a="volver">Volver</button>';
  $('dia').onchange = cargarFranjas;
  cargarFranjas();
}
$('out').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.parentElement?.id === 'slots') {
    if (b.disabled) return;
    pick = b.dataset.h; [...$('slots').children].forEach(x => x.setAttribute('aria-pressed', x === b)); $('conf').disabled = false; return;
  }
  const a = b.dataset.a; if (!a) return;
  if (a === 'repro') return abrirRepro();
  if (a === 'volver') return render(window._data);
  if (a === 'cancel') {
    $('acc').innerHTML = '<p style="color:var(--ink);margin:12px 0 0"><b>¿Seguro que querés cancelar tu solicitud #' + esc(window._data.ticket) + '?</b> Se libera el horario y no podrás deshacerlo.</p>' +
      '<button class="btn dangerfill" data-a="cancelar-ok">Sí, cancelar la solicitud</button><button class="btn alt" data-a="volver">No, volver</button>';
    return;
  }
  if (a === 'cancelar-ok' || a === 'confirmar') {
    document.querySelectorAll('#acc button').forEach(x => x.disabled = true);
    try {
      const body = { ...ctx, accion: a === 'confirmar' ? 'reprogramar' : 'cancelar' };
      if (a === 'confirmar') { body.fecha = $('dia').value; body.hora = pick; }
      const r = await llamar('modificar-solicitud', body);
      await consultar(r.accion === 'cancelar' ? 'Cancelamos tu solicitud. Avisamos a nuestro equipo.' : 'Reprogramamos tu visita para el ' + r.fecha.split('-').reverse().join('/') + ', de ' + r.franja + '. Te la confirmaremos con un nuevo mensaje.');
    } catch (err) {
      document.querySelectorAll('#acc button').forEach(x => x.disabled = false);
      const p = document.createElement('p'); p.style.cssText = 'color:var(--wr);margin:12px 0 0'; p.textContent = err.message; $('acc').append(p);
      if (a === 'confirmar') cargarFranjas();
    }
  }
};
</script>
</body>
</html>
