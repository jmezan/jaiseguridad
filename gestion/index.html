<style>
/* Layout: barra lateral fija con secciones; contenido en grillas de paneles. Colores tomados del logo: azul JAI + celeste del ojo. */
:root{
  --bg:#f3f4f7; --panel:#ffffff; --ink:#141b2d; --muted:#5c6577; --line:#dfe2ea;
  --navy:#1d2a55; --navy-ink:#e9edf6; --accent:#1f78c8; --accent-soft:#e3effa; --on-accent:#ffffff;
  --good:#1f7a4d; --good-soft:#e2f3ea; --warn:#a86200; --warn-soft:#fdf0d9; --bad:#b3261e; --bad-soft:#fbe5e3; --info:#2c5aa0; --info-soft:#e4ecf8;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif; --body:"IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1320; --panel:#161d2e; --ink:#e7eaf2; --muted:#98a1b5; --line:#283149;
  --navy:#0c1430; --navy-ink:#dfe5f2; --accent:#5aaef0; --accent-soft:#16304d; --on-accent:#06182b;
  --good:#5cc592; --good-soft:#15301f; --warn:#f0b04a; --warn-soft:#352812; --bad:#f08a80; --bad-soft:#3a1916; --info:#86adf0; --info-soft:#18284a; color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#0e1320; --panel:#161d2e; --ink:#e7eaf2; --muted:#98a1b5; --line:#283149;
  --navy:#0c1430; --navy-ink:#dfe5f2; --accent:#5aaef0; --accent-soft:#16304d; --on-accent:#06182b;
  --good:#5cc592; --good-soft:#15301f; --warn:#f0b04a; --warn-soft:#352812; --bad:#f08a80; --bad-soft:#3a1916; --info:#86adf0; --info-soft:#18284a; color-scheme: dark; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;font-weight:800} h2{font-size:18px;font-weight:700} h3{font-size:15px;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted)}
.app{display:block;min-height:100%}
nav.side{background:var(--navy);color:var(--navy-ink);padding:8px clamp(14px,2.5vw,28px);display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:40;box-shadow:0 2px 14px rgba(10,20,50,.18)}
.brand{display:flex;align-items:center;flex:none}
.brand img{display:block;height:42px;width:auto;background:#fff;border-radius:10px;padding:5px 10px;box-sizing:border-box}
.navItems{display:flex;align-items:center;gap:2px;flex:1;flex-wrap:wrap;min-width:0}
.ni{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:10px;color:inherit;background:none;border:0;font:600 14px var(--body);text-decoration:none;cursor:pointer;white-space:nowrap;position:relative}
nav.side svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ni svg{opacity:.8} .ni .chev{width:14px;height:14px;opacity:.6;margin-left:-2px}
.ni:hover{background:rgba(255,255,255,.09)}
.ni.on{background:rgba(255,255,255,.15);color:#fff} .ni.on svg{opacity:1}
.ni.on::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;border-radius:2px;background:var(--accent)}
.ni .cnt{font-size:11.5px;background:var(--accent);color:var(--on-accent);padding:0 6px;border-radius:9px;line-height:18px;font-weight:700}
.ni .cnt:empty,.ni .cnt[data-z]{display:none}
.grp{position:relative}
.grp .menu{display:none;position:absolute;top:100%;left:0;min-width:250px;padding-top:8px;z-index:50}
.grp .menu::before{content:"";position:absolute;inset:8px 0 0 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(10,20,50,.2)}
.grp:hover:not(.nohover) .menu,.grp.open .menu{display:flex;flex-direction:column}
.grp .menu a{position:relative;display:flex;align-items:center;gap:11px;margin:0 6px;padding:10px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500;font-size:14.5px}
.grp .menu a:first-child{margin-top:6px} .grp .menu a:last-child{margin-bottom:6px}
.grp .menu a svg{color:var(--accent)}
.grp .menu a:hover{background:var(--bg)} .grp .menu a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.grp .menu a .cnt{margin-left:auto;font-size:12px;background:var(--bg);color:var(--muted);padding:1px 8px;border-radius:10px;font-weight:600}
nav.side .foot{flex:none;font-size:11.5px;opacity:.6;max-width:190px;text-align:right;line-height:1.3}
@media (max-width:1280px){ nav.side .foot{display:none} }
@media (max-width:1180px){ .ni{padding:8px 8px;gap:5px;font-size:13.5px} nav.side{gap:10px} .brand img{height:36px;padding:4px 8px} .ni[data-v=inicio] .lbl,.ni[data-v=proveedores] .lbl,.ni[data-v=empleados] .lbl{display:none} }
@media (max-width:960px){ .ni>span:not(.cnt){display:none} .ni{padding:9px 10px} }
.side .foot{margin-top:auto;font-size:12px;opacity:.75;padding:8px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ===== JAI Gestión · conexión con Supabase =====
   Reemplaza las funciones que daba Claude (base de datos, usuario y descargas) por Supabase.
   Todos los datos viven en la tabla public.docs (col, id, data jsonb). */
(function(){
  const CFG = window.JAI_SUPABASE || {};
  // supabase-js borra el #... del link al iniciar: se revisa antes si vino del email de "olvidé mi contraseña"
  const RECUPERO = /type=recovery/.test(location.hash) || /type=recovery/.test(location.search);
  const sb = window.supabase.createClient(CFG.url, CFG.anonKey, { auth:{ persistSession:true, autoRefreshToken:true, experimental:{ passkey:true } } });
  window.__sb = sb;
  const rid = () => { const a="abcdefghijklmnopqrstuvwxyz0123456789"; let s=""; const r=crypto.getRandomValues(new Uint8Array(20)); for(const x of r) s+=a[x%36]; return s; };
  const clone = v => v==null?v:JSON.parse(JSON.stringify(v));
  const split = path => { const p=String(path).split("/"); const id=p.pop(); return {col:p.join("/"), id}; };

  /* --- caché y tiempo real --- */
  const cache = {};            // col -> Map(id -> data)
  const loaded = {};           // col -> Promise
  const listeners = {};        // col -> Set(fn)
  let channel = null;
  async function fetchCol(col){
    const map=new Map(); let from=0; const step=1000;
    for(;;){
      const {data,error}=await sb.from("docs").select("id,data").eq("col",col).range(from,from+step-1);
      if(error) throw error;
      data.forEach(r=>map.set(r.id,r.data)); if(data.length<step) break; from+=step;
    }
    cache[col]=map; return map;
  }
  function ensureCol(col){ if(!loaded[col]) loaded[col]=fetchCol(col).catch(e=>{ delete loaded[col]; throw e; }); return loaded[col]; }
  function emit(col){ (listeners[col]||new Set()).forEach(fn=>{ try{ fn(); }catch(e){ console.error(e); } }); }
  async function onChange(payload){
    const row=payload.new&&payload.new.col?payload.new:payload.old; if(!row||!row.col) return;
    const col=row.col, id=row.id; if(!cache[col]) return;
    if(payload.eventType==="DELETE"){ cache[col].delete(id); emit(col); return; }
    // se vuelve a leer la fila: así funciona aunque el registro sea muy grande para el aviso en tiempo real
    const {data,error}=await sb.from("docs").select("data").eq("col",col).eq("id",id).maybeSingle();
    if(error){ console.error(error); return; }
    if(data) cache[col].set(id,data.data); else cache[col].delete(id);
    emit(col);
  }
  function ensureChannel(){
    if(channel) return;
    channel=sb.channel("docs-all").on("postgres_changes",{event:"*",schema:"public",table:"docs"},onChange).subscribe(st=>{
      if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"){ console.warn("tiempo real:",st); }
    });
    // al volver a la pestaña o recuperar conexión, se refresca todo lo abierto
    const refresh=()=>{ Object.keys(listeners).forEach(col=>{ if(listeners[col].size) fetchCol(col).then(()=>emit(col)).catch(console.error); }); };
    window.addEventListener("online",refresh);
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") refresh(); });
  }
  const docSnap = (id,data) => ({ id, exists: data!==undefined, data: ()=>clone(data), metadata:{fromCache:false} });
  const colSnap = (col) => { const m=cache[col]||new Map(); const docs=[...m.entries()].map(([id,d])=>docSnap(id,d)); return { docs, size:docs.length, empty:!docs.length, metadata:{fromCache:false}, forEach:f=>docs.forEach(f) }; };

  function docRef(path){
    const {col,id}=split(path);
    return {
      id,
      async get(){ const {data,error}=await sb.from("docs").select("data").eq("col",col).eq("id",id).maybeSingle(); if(error) throw error; return docSnap(id,data?data.data:undefined); },
      async set(data){ const {error}=await sb.from("docs").upsert({col,id,data:clone(data)}); if(error) throw error; if(cache[col]){ cache[col].set(id,clone(data)); emit(col); } },
      async update(patch){ const {data,error}=await sb.rpc("doc_merge",{p_col:col,p_id:id,p_patch:clone(patch)}); if(error) throw error; if(cache[col]&&data){ cache[col].set(id,data); emit(col); } },
      async delete(){ const {error}=await sb.from("docs").delete().eq("col",col).eq("id",id); if(error) throw error; if(cache[col]){ cache[col].delete(id); emit(col); } },
      onSnapshot(next,err){
        ensureChannel(); (listeners[col]=listeners[col]||new Set());
        const fn=()=>next(docSnap(id,(cache[col]||new Map()).get(id)));
        listeners[col].add(fn); ensureCol(col).then(fn).catch(e=>err&&err(e));
        return ()=>listeners[col].delete(fn);
      }
    };
  }
  function colRef(col){
    return {
      doc:(id)=>docRef(col+"/"+(id||rid())),
      async get(){ await fetchCol(col); return colSnap(col); },
      onSnapshot(next,err){
        ensureChannel(); (listeners[col]=listeners[col]||new Set());
        const fn=()=>next(colSnap(col));
        listeners[col].add(fn); ensureCol(col).then(fn).catch(e=>err&&err(e));
        return ()=>listeners[col].delete(fn);
      }
    };
  }
  const db = { collection:colRef, doc:docRef };

  /* --- usuario --- */
  let sesion=null, esAdmin=false;
  const user = {
    isOwner: async()=>esAdmin, canEdit: async()=>esAdmin,
    can: async(k)=> k==="data.write" ? true : null,
    id: async()=> sesion?sesion.user.id:null,
    email: ()=> sesion?sesion.user.email:"",
    salir: async()=>{ await sb.auth.signOut(); location.reload(); },
    cambiarClave: ()=>pantallaLogin("nueva","Escribí tu contraseña nueva."),
    puedeBio: ()=>conPasskey(), nombreBio: ()=>nombreBio(), activarBio
  };

  /* --- descargas --- */
  const downloads = { save: async({filename,data})=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(data); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); } };

  /* --- login --- */
  let listo; const sesionLista=new Promise(r=>listo=r);
  async function entrar(s){
    sesion=s;
    try{ const {data}=await sb.rpc("is_admin"); esAdmin=!!data; }catch(e){ esAdmin=false; }
    const lg=document.getElementById("jaiLogin"); if(lg) lg.remove();
    listoYa=true; listo();
  }
  const conPasskey = () => !!(window.PublicKeyCredential && sb.auth.signInWithPasskey);
  const nombreBio = () => /iPhone|iPad/.test(navigator.userAgent) ? "Face ID" : (/Mac/.test(navigator.userAgent) ? "Touch ID" : "huella o Face ID");
  const msgPasskey = err => { const c=(err&&(err.code||err.name))||"", m=(err&&err.message)||String(err);
    if(/NotAllowed|AbortError|cancel/i.test(c+m)) return "Se canceló. Probá de nuevo cuando quieras.";
    if(/passkey_disabled/i.test(c+m)) return "El ingreso con "+nombreBio()+" todavía no está activado en Supabase (Authentication → Passkeys).";
    if(/credential_not_found/i.test(c+m)) return "Este "+nombreBio()+" no está registrado. Ingresá con tu email y contraseña y activalo de nuevo.";
    if(/credential_exists|InvalidState/i.test(c+m)) return "Este dispositivo ya está registrado.";
    return m; };
  // después de entrar con contraseña: ofrece activar Face ID una vez por dispositivo
  function ofrecerBio(s){
    let el=document.getElementById("jaiLogin"); if(!el){ el=document.createElement("div"); el.id="jaiLogin"; document.body.appendChild(el); }
    const bio=nombreBio();
    el.innerHTML=`<div class="lgBox">
      <img src="${(typeof LOGO!=="undefined"?LOGO:"")}" alt="JAI Seguridad" class="lgLogo">
      <h2>¿Entrar con ${bio}?</h2>
      <div class="lgMsg">La próxima vez vas a poder ingresar en este dispositivo con ${bio}, sin escribir la contraseña.</div>
      <button class="pri" type="button" id="lgBioSi">Activar ${bio}</button>
      <div class="lgLinks"><a href="#" id="lgBioNo">Ahora no</a></div></div>`;
    el.querySelector("#lgBioNo").onclick=e=>{ e.preventDefault(); try{ localStorage.setItem("jaiBioOfrecido","1"); }catch(_){} entrar(s); };
    el.querySelector("#lgBioSi").onclick=async()=>{ const b=el.querySelector("#lgBioSi"); b.disabled=true; b.textContent="Un momento…";
      try{ const {error}=await sb.auth.registerPasskey(); if(error) throw error; try{ localStorage.setItem("jaiBioOfrecido","1"); localStorage.setItem("jaiBio","1"); }catch(_){} entrar(s); }
      catch(err){ console.error(err); const m=msgPasskey(err); el.querySelector(".lgMsg").innerHTML="<b>No se pudo:</b> "+m.replace(/</g,"&lt;"); b.disabled=false; b.textContent="Probar de nuevo"; } };
  }
  async function activarBio(){
    if(!conPasskey()){ alert("Este navegador no permite ingresar con "+nombreBio()+"."); return false; }
    try{ const {error}=await sb.auth.registerPasskey(); if(error) throw error; try{ localStorage.setItem("jaiBio","1"); localStorage.setItem("jaiBioOfrecido","1"); }catch(_){} return true; }
    catch(err){ console.error(err); throw new Error(msgPasskey(err)); }
  }
  /* --- bloqueo al abrir la app (dueño, en el celular): pide Face ID o la contraseña --- */
  const BLOQUEO_SEG = 30;   // si la app estuvo en segundo plano más que esto, se vuelve a bloquear
  const enCelular = () => /iPhone|iPad|Android/.test(navigator.userAgent) || (window.matchMedia&&matchMedia("(display-mode: standalone)").matches) || navigator.standalone===true;
  let bloqueada=false, ocultaDesde=0;
  async function arrancar(s){
    let adm=false; try{ const {data}=await sb.rpc("is_admin"); adm=!!data; }catch(_){}
    if(adm && enCelular()) pantallaBloqueo(s); else await entrar(s);
  }
  function pantallaBloqueo(s){
    bloqueada=true;
    let el=document.getElementById("jaiLogin"); if(!el){ el=document.createElement("div"); el.id="jaiLogin"; document.body.appendChild(el); }
    const bio=nombreBio(); let tieneBio=false; try{ tieneBio=!!localStorage.getItem("jaiBio"); }catch(_){}
    const mail=(s&&s.user&&s.user.email)||"";
    el.innerHTML=`<form class="lgBox" autocomplete="on">
      <img src="${(typeof LOGO!=="undefined"?LOGO:"")}" alt="JAI Seguridad" class="lgLogo">
      <h2>🔒 Desbloqueá para entrar</h2>
      <div class="lgMsg" id="lgBlqMsg" style="${mail?"":"display:none"}">${mail.replace(/</g,"&lt;")}</div>
      ${conPasskey()?`<button type="button" class="pri" id="lgBlqBio">Desbloquear con ${bio}</button>`:""}
      <input type="email" name="email" autocomplete="username" value="${mail.replace(/"/g,"&quot;")}" class="hide" readonly>
      <label>Contraseña<input type="password" id="lgBlqPass" autocomplete="current-password" ${conPasskey()?"":"required"}></label>
      <button type="submit" class="${conPasskey()?"lgBio":"pri"}">Desbloquear con contraseña</button>
      <div class="lgLinks"><a href="#" id="lgBlqSalir">Salir / entrar con otro usuario</a></div></form>`;
    const ok=async ns=>{ bloqueada=false; ocultaDesde=0; if(ns) sesion=ns; if(listoYa) { const lg=document.getElementById("jaiLogin"); if(lg) lg.remove(); } else await entrar(ns||s); };
    const err=m=>{ const x=el.querySelector("#lgBlqMsg"); x.style.display=""; x.innerHTML="<b>No se pudo:</b> "+String(m).replace(/</g,"&lt;"); };
    const bb=el.querySelector("#lgBlqBio");
    if(bb) bb.onclick=async()=>{ bb.disabled=true; bb.textContent="Un momento…";
      try{ const {data,error}=await sb.auth.signInWithPasskey(); if(error) throw error;
        if(s&&s.user&&data.user&&data.user.id!==s.user.id){ await sb.auth.signOut(); location.reload(); return; }
        await ok(data.session); }
      catch(e){ console.error(e); err(msgPasskey(e)); bb.disabled=false; bb.textContent="Desbloquear con "+bio; } };
    el.querySelector("form").onsubmit=async e=>{ e.preventDefault(); const pass=el.querySelector("#lgBlqPass").value; if(!pass){ el.querySelector("#lgBlqPass").focus(); return; }
      const b=el.querySelector("button[type=submit]"); b.disabled=true; b.textContent="Un momento…";
      try{ const {data,error}=await sb.auth.signInWithPassword({email:mail,password:pass}); if(error) throw error; await ok(data.session); }
      catch(e2){ err(/Invalid login/i.test(e2.message||"")?"Contraseña incorrecta.":(e2.message||e2)); b.disabled=false; b.textContent="Desbloquear con contraseña"; } };
    el.querySelector("#lgBlqSalir").onclick=async e=>{ e.preventDefault(); await sb.auth.signOut(); location.reload(); };
  }
  let listoYa=false;
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="hidden"){ ocultaDesde=Date.now(); return; }
    if(!bloqueada && listoYa && esAdmin && enCelular() && ocultaDesde && Date.now()-ocultaDesde>BLOQUEO_SEG*1000) pantallaBloqueo(sesion);
  });
  function pantallaLogin(modo, msg){
    let el=document.getElementById("jaiLogin");
    if(!el){ el=document.createElement("div"); el.id="jaiLogin"; document.body.appendChild(el); }
    const t={entrar:"Ingresar",registro:"Crear mi cuenta",olvido:"Recuperar contraseña",nueva:"Nueva contraseña"}[modo];
    el.innerHTML=`<form class="lgBox" autocomplete="on">
      <img src="${(typeof LOGO!=="undefined"?LOGO:"")}" alt="JAI Seguridad" class="lgLogo">
      <h2>${t}</h2>
      ${msg?`<div class="lgMsg">${msg}</div>`:""}
      ${modo!=="nueva"?`<label>Email<input type="email" name="email" id="lgMail" autocomplete="username" required></label>`:""}
      ${modo!=="olvido"?`<label>${modo==="nueva"?"Contraseña nueva":"Contraseña"}<input type="password" id="lgPass" autocomplete="${modo==="entrar"?"current-password":"new-password"}" minlength="6" required></label>`:""}
      <button class="pri" type="submit">${t}</button>
      ${modo==="entrar"&&conPasskey()?`<button type="button" id="lgBio" class="lgBio">Ingresar con ${nombreBio()}</button>`:""}
      <div class="lgLinks">
        ${modo==="entrar"?`<a href="#" data-m="olvido">Olvidé mi contraseña</a><a href="#" data-m="registro">Soy instalador y me invitaron</a>`:""}
        ${modo==="registro"||modo==="olvido"?`<a href="#" data-m="entrar">Ya tengo cuenta: ingresar</a>`:""}
      </div></form>`;
    el.querySelectorAll("[data-m]").forEach(a=>a.onclick=e=>{ e.preventDefault(); pantallaLogin(a.dataset.m); });
    const bb=el.querySelector("#lgBio"); if(bb) bb.onclick=async()=>{ bb.disabled=true; bb.textContent="Un momento…";
      try{ const {data,error}=await sb.auth.signInWithPasskey(); if(error) throw error; await entrar(data.session); }
      catch(err){ console.error(err); pantallaLogin("entrar","<b>No se pudo:</b> "+msgPasskey(err).replace(/</g,"&lt;")); } };
    el.querySelector("form").onsubmit=async e=>{
      e.preventDefault(); const b=el.querySelector("button[type=submit]"); b.disabled=true; b.textContent="Un momento…";
      const mail=(el.querySelector("#lgMail")||{}).value, pass=(el.querySelector("#lgPass")||{}).value;
      try{
        if(modo==="entrar"){ const {data,error}=await sb.auth.signInWithPassword({email:mail,password:pass}); if(error) throw error;
          let ya=false; try{ ya=!!localStorage.getItem("jaiBioOfrecido"); }catch(_){}
          if(conPasskey() && !ya && /iPhone|iPad|Mac|Android/.test(navigator.userAgent)) ofrecerBio(data.session); else await entrar(data.session); }
        else if(modo==="registro"){ const {data,error}=await sb.auth.signUp({email:mail,password:pass,options:{emailRedirectTo:location.href.split("#")[0]}}); if(error) throw error;
          if(data.session) await entrar(data.session); else pantallaLogin("entrar","Te mandamos un email para confirmar la cuenta. Abrilo y después ingresá acá."); }
        else if(modo==="olvido"){ const {error}=await sb.auth.resetPasswordForEmail(mail,{redirectTo:location.href.split("#")[0]}); if(error) throw error; pantallaLogin("entrar","Si el email está registrado, te llega un link para cambiar la contraseña."); }
        else if(modo==="nueva"){ const {error}=await sb.auth.updateUser({password:pass}); if(error) throw error; const {data}=await sb.auth.getSession(); await entrar(data.session); }
      }catch(err){
        let m=err.message||String(err);
        if(/Invalid login/i.test(m)) m="Email o contraseña incorrectos.";
        else if(/session missing|session_not_found|JWT expired/i.test(m)){ pantallaLogin("entrar","Ese link ya no sirve (se usó o venció). Tocá «Olvidé mi contraseña» para pedir uno nuevo, o ingresá con tu contraseña."); return; }
        else if(/rate limit|over_email/i.test(m)) m="Ya se mandaron varios emails en la última hora. Esperá un rato (hasta 1 hora) y probá de nuevo.";
        else if(/Email not confirmed/i.test(m)) m="Falta confirmar el email: abrí el mail que te mandamos y tocá el link.";
        else if(/not confirmed/i.test(m)) m="Todavía no confirmaste tu email: revisá tu casilla.";
        else if(/invitaci|not invited|Database error saving new user/i.test(m)) m="Ese email no tiene una invitación. Pedile a JAI Seguridad que te invite.";
        else if(/already registered/i.test(m)) m="Ese email ya tiene cuenta: ingresá con tu contraseña.";
        pantallaLogin(modo, `<b>No se pudo:</b> ${m.replace(/</g,"&lt;")}`);
      }
    };
    setTimeout(()=>{ const f=el.querySelector("input"); f&&f.focus(); },50);
  }
  let pidioNueva=false;
  const pedirNueva=()=>{ if(pidioNueva) return; pidioNueva=true; pantallaLogin("nueva","Elegí tu contraseña nueva para terminar."); };
  sb.auth.onAuthStateChange((ev,s)=>{ if(ev==="PASSWORD_RECOVERY") pedirNueva(); });
  (async()=>{
    const {data}=await sb.auth.getSession();
    if(RECUPERO){ let ok=!!data.session; if(ok){ try{ const r=await sb.auth.getUser(); ok=!!(r.data&&r.data.user); }catch(_){ ok=false; } }
      if(ok) pedirNueva(); else pantallaLogin("entrar","El link para cambiar la contraseña ya se usó o venció. Pedí uno nuevo con «Olvidé mi contraseña»."); }
    else if(data.session) await arrancar(data.session);
    else pantallaLogin("entrar");
  })();

  /* --- lo que usa el dashboard --- */
  window.claude = { use: async(name)=>{ await sesionLista;
    if(name==="db") return db; if(name==="user") return user; if(name==="downloads") return downloads; return null; } };
})();

</script>
<script>
"use strict";

document.getElementById("brandLogo").src=LOGO; document.getElementById("mLogo").src=LOGO;
document.getElementById("tMas").onclick=()=>{ const sh=document.getElementById("sheet"), v=location.hash.slice(1)||"inicio";
  document.getElementById("sheetIn").innerHTML=[...document.querySelectorAll("nav.side a[data-v]")].filter(a=>!a.classList.contains("hide")).map(a=>`<a href="#${a.dataset.v}" class="${a.dataset.v===v?"on":""}">${a.querySelector(".lbl").textContent}${a.querySelector(".cnt")&&a.querySelector(".cnt").textContent!=="0"?`<span class="pill p-mut">${a.querySelector(".cnt").textContent}</span>`:""}</a>`).join("");
  sh.classList.remove("hide"); };
document.getElementById("sheet").onclick=e=>{ if(e.target.id==="sheet"||e.target.closest("a")) document.getElementById("sheet").classList.add("hide"); };
window.addEventListener("hashchange",()=>window.scrollTo(0,0));
document.querySelectorAll("nav.side .gbtn").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const g=b.parentElement, ab=!g.classList.contains("open"); document.querySelectorAll("nav.side .grp").forEach(x=>x.classList.remove("open")); g.classList.toggle("open",ab); });
document.addEventListener("click",e=>{ if(!e.target.closest("nav.side .grp")) document.querySelectorAll("nav.side .grp.open").forEach(x=>x.classList.remove("open")); });
document.querySelectorAll("nav.side .menu a").forEach(a=>a.addEventListener("click",()=>{ const g=a.closest(".grp"); g.classList.remove("open"); g.classList.add("nohover"); setTimeout(()=>g.classList.remove("nohover"),400); }));
/* ---------- utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const fmt = new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0});
const money = n => fmt.format(Math.round(Number(n)||0));
const fmtUsd = n => (Number(n)||0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fdate = iso => { if(!iso) return "—"; const d=new Date(iso); return isNaN(d)? "—" : d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"}); };
const fdatetime = iso => { if(!iso) return "—"; const d=new Date(iso); return isNaN(d)? "—" : d.toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); };
const today = () => new Date().toISOString().slice(0,10);
const esMovil = () => window.matchMedia("(max-width:700px)").matches;
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
let toastT; function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),3200); }
function loadScript(src){ return new Promise((ok,ko)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error("No se pudo cargar "+src)); document.head.appendChild(s); }); }

/* ---------- estado ---------- */
const S = {
  db:null, user:null, ready:false,
  cfg:{margen:15, empresa:"JAI Seguridad", telefono:"", email:"", validez:7, pie:"Precios en pesos argentinos. Sujetos a disponibilidad de stock."},
  meta:null, chunks:{}, cat:[], gmeta:null, gchunks:{}, gcat:[], propios:[], prop:[], all:[], catIdx:new Map(), fOrig:"",
  clientes:[], cotiz:[], pedidos:[], movs:[],
  cart:{id:null, clienteId:"", items:[], descuento:0, notas:"", validez:null},
  showCost:false, q:"", fMarca:"", fCat:"", soloStock:true,
  selCliente:null, clienteTab:"cuenta", listaQ:"", cliQ:"",
  fotos:new Map(), fotoBuckets:{}, provs:[], movProv:[], selProv:"ts", fotosEstado:"", empleados:[], pagosEmp:[], selEmp:null, esDueno:true, agenda:[], partes:[], ordenes:[], agendaOk:false, ordenesOk:false, modoTec:false, agFiltro:"pendientes", agDia:null, agMes:null
};
const ESTADOS_COT = {borrador:["Pendiente","p-mut"], enviada:["Enviada","p-info"], aceptada:["Aceptada","p-good"], rechazada:["Rechazada","p-bad"], vencida:["Vencida","p-warn"]};
const ESTADOS_PED = {pendiente:["Pendiente","p-warn"], preparando:["En preparación","p-info"], entregado:["Entregado","p-good"], cancelado:["Cancelado","p-bad"]};

/* precio de venta = costo del proveedor + margen */
const venta = costo => costo>0 ? Math.round(costo*(1+(Number(S.cfg.margen)||0)/100)) : 0;
const cliNombre = id => (S.clientes.find(c=>c.id===id)||{}).nombre || "Sin cliente";
const saldoCliente = id => S.movs.filter(m=>m.clienteId===id).reduce((a,m)=>a+(m.tipo==="cargo"?1:-1)*(Number(m.importe)||0),0);
const cotNum = n => "JAI-"+String(n||0).padStart(3,"0");
const cotN = c => cotNum(c&&(c.xubioNum||c.numero));
const pedNum = n => "PED-"+String(n||0).padStart(4,"0");
const nextNum = arr => arr.reduce((m,x)=>Math.max(m,Number(x.numero)||0),0)+1;

/* ---------- base de datos ---------- */
async function write(fn, okMsg){
  if(!S.db){ toast("La base de datos no está disponible en esta vista."); return false; }
  try{ await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    const c=e&&e.code;
    if(c==="invalid_argument") toast("No tenés permiso para guardar cambios, o el dato es inválido.");
    else if(c==="quota_exceeded") toast("La base de datos está llena: "+(e.message||""));
    else toast("No se pudo guardar. Probá de nuevo en unos segundos.");
    console.error(e); return false;
  }
}
function rebuildCatalog(){
  const m=S.meta; const items=[];
  if(m && m.chunks){ for(let i=0;i<m.chunks;i++){ const c=S.chunks["c"+i]; if(c&&Array.isArray(c.items)) items.push(...c.items); } }
  S.cat = items.map(r=>({key:String(r[0]||""), codigo:String(r[0]||""), marca:String(r[1]||""), categoria:String(r[2]||""), costo:Number(r[3])||0, tag:String(r[4]||""), desc:String(r[5]||""), foto:String(r[6]||""), _k:norm(r[0]+" "+r[1]+" "+r[2]+" "+r[5])}));
  S.prop = S.propios.map(p=>({key:"P:"+p.id, id:p.id, propio:true, codigo:String(p.codigo||""), marca:String(p.marca||""), categoria:String(p.categoria||""), costo:Number(p.costo)||0, precioFijo:Number(p.precio)||0, margen:(p.margen===""||p.margen==null)?null:Number(p.margen), tag:"", desc:String(p.nombre||""), _k:norm([p.codigo,p.marca,p.categoria,p.nombre].join(" "))}));
  const gm=S.gmeta, gi=[];
  if(gm && gm.chunks){ for(let i=0;i<gm.chunks;i++){ const c=S.gchunks["c"+i]; if(c&&Array.isArray(c.items)) gi.push(...c.items); } }
  const tc=tcGelin();
  S.gcat = gi.map(r=>{ const usd=Number(r[3])||0, iva=Number(r[7])||0; return {key:"G:"+r[0], gelin:true, codigo:String(r[0]||""), marca:String(r[1]||""), categoria:String(r[2]||""), usd, iva, stock:String(r[8]||""),
    costo: usd>0&&tc>0 ? Math.round(usd*tc*(S.cfg.gelinSumarIva&&iva?1+iva/100:1)) : 0, tag:String(r[4]||""), desc:String(r[5]||""), foto:"", _k:norm(r[0]+" "+r[1]+" "+r[2]+" "+r[5]+" gelin")}; });
  S.all = [...S.prop, ...S.cat, ...S.gcat];
  S.catIdx = new Map(S.all.map(p=>[p.key,p]));
}
/* tipo de cambio de la lista Gelin (en USD): el del Banco Nación (venta) o uno cargado a mano */
function tcGelin(){
  const bna=Number(S.cfg.bnaVenta)||0, man=Number(S.cfg.gelinTC)||0;
  return S.cfg.gelinTCModo==="manual" ? man : (bna||man);
}
/* precio de venta: los propios usan su precio fijo, o su costo + su margen (o el margen general) */
function precioDe(p){
  if(!p) return 0;
  if(!p.propio) return venta(p.costo);
  if(p.precioFijo>0) return Math.round(p.precioFijo);
  return p.costo>0 ? Math.round(p.costo*(1+(p.margen??(Number(S.cfg.margen)||0))/100)) : 0;
}
async function initDb(){
  const timer=setTimeout(()=>{ if(!S.ready) setBanner("warn","No se pudo conectar con la base de datos todavía. Los datos pueden no estar al día."); },10000);
  let db=null, user=null;
  try{ [db,user]=await Promise.all([window.claude?.use("db"), window.claude?.use("user")]); }catch(e){}
  S.db=db; S.user=user;
  if(!db){ clearTimeout(timer); setBanner("bad","No se pudo conectar con la base de datos. Revisá tu conexión y recargá la página."); return; }
  // quien no es dueño ni editor entra en modo instalador: solo ve sus órdenes de trabajo
  try{ const ce=user&&user.canEdit?await user.canEdit():true; S.esDueno=ce!==false; }catch(e){}
  if(!S.esDueno){ clearTimeout(timer); setBanner(null); return initTecnico(db,user); }
  const onErr = e => { clearTimeout(timer); setBanner("bad","Se perdió la conexión con la base de datos. Recargá la página."); console.error(e); };
  const firstLoad = new Set();
  const mark = (k,snap) => { if(!snap.metadata.fromCache){ firstLoad.add(k); if(firstLoad.size>=8 && !S.ready){ S.ready=true; clearTimeout(timer); setBanner(null); flushPending(); } } };
  db.doc("config/general").onSnapshot(s=>{ if(s.exists) S.cfg={...S.cfg,...s.data()}; rebuildCatalog(); mark("cfg",s); render(); }, onErr);
  db.collection("gelin").onSnapshot(s=>{ S.gchunks={}; S.gmeta=null; s.docs.forEach(d=>{ if(d.id==="meta") S.gmeta=d.data(); else S.gchunks[d.id]=d.data(); }); rebuildCatalog(); mark("gelin",s); render(); }, onErr);

function setBanner(kind,msg){ const b=$("#dbBanner"); if(!kind){ b.className="banner hide"; return; } b.className="banner "+kind; b.textContent=msg; }

/* ---------- importación de lista ---------- */
const pending=[];
function flushPending(){ while(pending.length){ const p=pending.shift(); importarLista(p.items,p.fuente,p.version,p.reply); } }
let importando=false;
async function importarLista(items, fuente, version, reply){
  const done = (ok,msg,extra) => { try{ reply && reply({type:"jai-ldp-ack",ok,msg,...(extra||{})}); }catch(e){} };
  if(!S.ready){ pending.push({items,fuente,version,reply}); return; }
  if(importando){ done(false,"Ya hay una importación en curso"); return; }
  const clean=[]; const seen=new Set();
  for(const r of items){
    if(!Array.isArray(r)) continue;
    const cod=String(r[0]||"").trim().slice(0,120); if(!cod || seen.has(cod)) continue; seen.add(cod);
    const costo=Math.max(0,Math.round(Number(r[3])||0));
    clean.push([cod,String(r[1]||"").slice(0,60),String(r[2]||"").slice(0,80),costo,String(r[4]||"").slice(0,40),String(r[5]||"").slice(0,400),fotoHash(r[6])]);
  }
  if(clean.length<20){ toast("La lista recibida está vacía o no tiene el formato esperado."); done(false,"Formato inválido o lista vacía"); return; }
  importando=true; setBanner("info","Actualizando la lista de precios ("+clean.length+" productos)…");
  // comparar con la lista anterior
  const prev=new Map(S.cat.map(p=>[p.codigo,p])); let subieron=0,bajaron=0,nuevos=0;
  for(const r of clean){ const p=prev.get(r[0]); if(!p) nuevos++; else if(r[3]>p.costo) subieron++; else if(r[3]<p.costo) bajaron++; }
  const nuevosSet=new Set(clean.map(r=>r[0])); let quitados=0; prev.forEach((_,k)=>{ if(!nuevosSet.has(k)) quitados++; });
  const SIZE=250, n=Math.ceil(clean.length/SIZE);
  const ok = await write(async()=>{
    for(let i=0;i<n;i++) await S.db.doc("catalogo/c"+i).set({items:clean.slice(i*SIZE,(i+1)*SIZE)});
    const oldN=(S.meta&&S.meta.chunks)||0;
    const hist=((S.meta&&S.meta.historial)||[]).slice(0,19);
    const entry={fecha:new Date().toISOString(),fuente:fuente||"Manual",total:clean.length,subieron,bajaron,nuevos,quitados};
    await S.db.doc("catalogo/meta").set({chunks:n,total:clean.length,actualizado:entry.fecha,fuente:entry.fuente,version:String(version||""),historial:[entry,...hist]});
    for(let i=n;i<oldN;i++) await S.db.doc("catalogo/c"+i).delete();
  });
  importando=false;
  if(ok){ setBanner("good","Lista actualizada: "+clean.length+" productos · "+subieron+" subieron, "+bajaron+" bajaron, "+nuevos+" nuevos."); setTimeout(()=>setBanner(null),8000); done(true,"ok",{total:clean.length,subieron,bajaron,nuevos,quitados}); }
  else { setBanner("bad","No se pudo guardar la lista nueva."); done(false,"Error al guardar"); }
}

  for(const r of clean){ const p=prev.get(r[0]); if(!p) nuevos++; else if(r[3]>p.usd) subieron++; else if(r[3]<p.usd) bajaron++; }
  const nuevosSet=new Set(clean.map(r=>r[0])); let quitados=0; prev.forEach((_,k)=>{ if(!nuevosSet.has(k)) quitados++; });
  const SIZE=250, n=Math.ceil(clean.length/SIZE);
  const ok=await write(async()=>{
    for(let i=0;i<n;i++) await S.db.doc("gelin/c"+i).set({items:clean.slice(i*SIZE,(i+1)*SIZE)});
    const oldN=(S.gmeta&&S.gmeta.chunks)||0;
    const entry={fecha:new Date().toISOString(),total:clean.length,subieron,bajaron,nuevos,quitados};
    await S.db.doc("gelin/meta").set({chunks:n,total:clean.length,actualizado:entry.fecha,historial:[entry,...(((S.gmeta&&S.gmeta.historial)||[]).slice(0,19))]});
    for(let i=n;i<oldN;i++) await S.db.doc("gelin/c"+i).delete();
  });
  if(ok) await guardarBna(bna);
  importandoG=false;
  if(ok) done(true,"ok",{total:clean.length,subieron,bajaron,nuevos,quitados,tc:tcGelin()}); else done(false,"No se pudo guardar");
}

function localGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function localSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* ---------- fotos de productos ---------- */
// cada foto se guarda achicada (~3 KB) en 64 documentos "fotos/bNN", agrupadas por el inicio de su clave
const fotoHash = v => String(v||"").replace(/^ORIGEN_FOTO:/,"").replace(/[^0-9a-f]/gi,"").slice(0,16).toLowerCase();
const fotoBucket = h => "b"+String(parseInt(h.slice(0,2),16)%64).padStart(2,"0");
let fotosPromise=null;
function ensureFotos(){
  if(fotosPromise) return fotosPromise;
  if(!S.db) return Promise.resolve();
  S.fotosEstado="cargando";
  fotosPromise=S.db.collection("fotos").get().then(snap=>{
    snap.docs.forEach(d=>{ const f=(d.data()||{}).f||{}; S.fotoBuckets[d.id]={...f}; for(const h in f) S.fotos.set(h,f[h]); });
    S.fotosEstado="ok"; render();
  }).catch(e=>{ console.error(e); S.fotosEstado="error"; fotosPromise=null; });
  return fotosPromise;
}
// foto de un renglón: la guardada o, si no tiene, la del producto en la lista actual
const fotoDe = i => i.foto || (S.catIdx.get(i.key||i.codigo)||{}).foto || "";
const fotoImg = (h,cls) => { const u=h&&S.fotos.get(h); return u?`<img class="${cls}" src="${u}" alt="" loading="lazy">`:`<div class="${cls} nofoto" aria-hidden="true"></div>`; };
let fotoQueue=Promise.resolve(), fotoDirty=new Set();
function recibirFotos(fotos){
  let n=0;
  for(const [k,u] of Object.entries(fotos||{})){
    const h=fotoHash(k); if(!h||typeof u!=="string"||!u.startsWith("data:image/")||u.length>40000) continue;
    const b=fotoBucket(h); (S.fotoBuckets[b]=S.fotoBuckets[b]||{})[h]=u; S.fotos.set(h,u); fotoDirty.add(b); n++;
  }
  return n;
}
function guardarFotos(){
  // escribe solo los grupos que cambiaron, de a uno
  fotoQueue=fotoQueue.then(async()=>{
    const ids=[...fotoDirty]; fotoDirty=new Set(); let ok=0;
    for(const b of ids){ try{ await S.db.doc("fotos/"+b).set({f:S.fotoBuckets[b]}); ok++; }catch(e){ console.error(e); fotoDirty.add(b); } }
    return {ok,fallaron:ids.length-ok};
  });
  return fotoQueue;
}

// canal para la actualización automática: la pestaña del proveedor envía la lista a esta página
window.addEventListener("message", async e=>{
  const d=e.data; if(!d||typeof d!=="object") return;
  const reply=m=>{ try{ e.source&&e.source.postMessage(m,"*"); }catch(x){} };
  const hook=(t,x)=>{ try{ syncHook&&syncHook(t,x); }catch(err){} };
  if(d.type==="jai-ping"){ reply({type:"jai-pong",ready:S.ready}); hook("ping",d.v); return; }
  if(d.type==="jai-fotos-have"){ if(!S.ready){ reply({type:"jai-fotos-have-ack",ok:false,msg:"no listo"}); return; } await ensureFotos(); reply({type:"jai-fotos-have-ack",ok:S.fotosEstado==="ok",have:[...S.fotos.keys()]}); return; }
  if(d.type==="jai-fotos"){ const n=recibirFotos(d.fotos); let r={ok:0,fallaron:0}; if(d.guardar) r=await guardarFotos(); reply({type:"jai-fotos-ack",id:d.id,recibidas:n,...r,total:S.fotos.size});
    S._fotosNuevas=(S._fotosNuevas||0)+n; if(d.guardar){ render(); hook("fotos-ok"); S._fotosNuevas=0; } else hook("fotos",S._fotosNuevas); return; }
  if(d.type==="jai-bna"){ guardarBna(d.bna); reply({type:"jai-bna-ack"}); return; }
  if(d.type==="jai-gelin"&&Array.isArray(d.items)){ hook("lista",d.items.length);
    importarGelin(d.items,d.bna,r=>{ reply(r); hook(r.ok?"gelin-ok":"error",r.ok?r:"No se pudo guardar la lista de Gelin: "+(r.msg||"error")); }); return; }
  if(d.type!=="jai-ldp"||!Array.isArray(d.items)) return;
  hook("lista",d.items.length);
  importarLista(d.items,"Proveedor · actualización a pedido",d.version,r=>{ reply(r); hook(r.ok?"lista-ok":"error",r.ok?r:"No se pudo guardar la lista: "+(r.msg||"error")); });
});
async function importarArchivo(file){
  try{
    let rows;

async function descargarRespaldo(){

async function importarRespaldo(file){

  const cols=Object.keys(js.colecciones||{}).filter(c=>!["partes","ordenes"].includes(c));
  const total=cols.reduce((a,c)=>a+js.colecciones[c].length,0);
  confirmar(`Cargar ${total} registros del respaldo del ${fdate(js.exportado)} (${cols.join(", ")}). Si ya existen, se reemplazan.`,async()=>{
    const sbc=window.__sb; let hechos=0; toast("Importando… no cierres la página.");

      for(const r of js.colecciones[c]){ const row={col:c,id:String(r.id),data:r.data||{}}; const n=JSON.stringify(row).length; if(tam+n>1500000) await enviar(); tanda.push(row); tam+=n; }

function bindCliCombo(){
  const x=$("#cCliX"); if(x){ x.onclick=()=>{ S.cart.clienteId=""; S.cliQ=""; renderCart(); setTimeout(()=>$("#cCliQ")?.focus(),0); }; return; }
  const inp=$("#cCliQ"), list=$("#cCliL"); if(!inp) return;
  let act=0, res=[];
  const pick=id=>{ S.cart.clienteId=id; S.cliQ=""; renderCart(); };
  const draw=()=>{
    const q=norm(inp.value).split(/\s+/).filter(Boolean);
    res=S.clientes.filter(c=>{ const k=norm([c.nombre,c.cuit,String(c.cuit||"").replace(/\D/g,""),c.telefono,c.localidad].join(" ")); return q.every(w=>k.includes(w)); }).sort((a,b)=>a.nombre.localeCompare(b.nombre)).slice(0,8);
    act=Math.min(act,Math.max(0,res.length-1));
    list.innerHTML=res.length?res.map((c,i)=>`<div class="opt ${i===act?"on":""}" role="option" data-id="${esc(c.id)}"><b>${esc(c.nombre)}</b><span class="muted">${esc([c.cuit,c.telefono,c.localidad].filter(Boolean).join(" · "))}</span></div>`).join("")
      :`<div class="opt muted">${S.clientes.length?"Ningún cliente coincide. Usá «+ Cliente» para crearlo.":"Todavía no hay clientes cargados."}</div>`;
    list.classList.remove("hide");
  };
  inp.oninput=()=>{ S.cliQ=inp.value; act=0; draw(); };
  inp.onfocus=draw;
  inp.onblur=()=>setTimeout(()=>list.classList.add("hide"),150);
  inp.onkeydown=e=>{
    if(e.key==="ArrowDown"){ act=Math.min(act+1,res.length-1); draw(); e.preventDefault(); }
    else if(e.key==="ArrowUp"){ act=Math.max(act-1,0); draw(); e.preventDefault(); }
    else if(e.key==="Enter"&&res[act]){ pick(res[act].id); e.preventDefault(); }
  };
  list.onmousedown=e=>{ const o=e.target.closest("[data-id]"); if(o){ e.preventDefault(); pick(o.dataset.id); } };
}

/* ---------- Cambios de precio en cotizaciones activas ---------- */
// compara cada producto de la cotización con el precio que tendría hoy según la lista
function cambiosCot(c){
  if(!c||c.pedidoId) return null; const e=estEf(c); if(e!=="borrador"&&e!=="enviada") return null;
  const its=(c.items||[]).map(i=>{ if(String(i.key||"").startsWith("X:")) return {i,ahora:null};
    // si cambió el costo del proveedor desde que se cotizó, se ajusta el precio en la misma proporción (respeta precios especiales y márgenes)
    const p=S.catIdx.get(i.key||i.codigo), c0=Number(i.costo)||0, c1=p?Number(p.costo)||0:0;
    if(!p||c0<=0||c1<=0||Math.abs(c1-c0)<1) return {i,p,ahora:null};
    return {i,p,ahora:Math.round((Number(i.precio)||0)*c1/c0)}; });
  const cambios=its.filter(x=>x.ahora!=null&&Math.abs(x.ahora-(Number(x.i.precio)||0))>=1);
  if(!cambios.length) return null;
  const firma=cambios.map(x=>(x.i.key||x.i.codigo)+":"+x.ahora).join("|");
  if(c.preciosRevisados===firma) return null;
  const subAhora=its.reduce((a,x)=>a+(x.ahora!=null?x.ahora:(Number(x.i.precio)||0))*(Number(x.i.cant)||0),0);
  const totAhora=Math.round(subAhora*(1-(Number(c.descuento)||0)/100));
  const suben=cambios.filter(x=>x.ahora>x.i.precio), bajan=cambios.filter(x=>x.ahora<x.i.precio);
  return {its,cambios,suben,bajan,firma,subAhora,totAhora,dif:totAhora-(Number(c.total)||0),pct:c.total?Math.round((totAhora-c.total)/c.total*1000)/10:0};
}

/* ---------- Presupuestos importados de Xubio ---------- */
// el Excel de Xubio trae solo el encabezado: fecha, vencimiento, N°, cliente, total, estado y observaciones
const estadoXubio = e => { const n=norm(e); if(/rechaz|anulad/.test(n)) return "rechazada"; if(/aprobad|aceptad|facturad/.test(n)) return "aceptada"; return "enviada"; };
const fechaX = v => { if(v instanceof Date) return v; if(typeof v==="number") return new Date(Math.round((v-25569)*864e5)); const m=String(v||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if(m) return new Date(+(m[3].length===2?"20"+m[3]:m[3]),+m[2]-1,+m[1]); const d=new Date(v); return isNaN(d)?null:d; };
const mediodia = d => new Date(d.getFullYear(),d.getMonth(),d.getDate(),12,0,0);
async function importarCotXubio(file){
  try{
    if(!window.XLSX) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true}); const ws=wb.Sheets[wb.SheetNames[0]];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true});
    const hi=aoa.findIndex(r=>r.some(c=>/^documento$/i.test(String(c).trim()))&&r.some(c=>/^cliente$/i.test(String(c).trim())));
    if(hi<0){ toast("No reconozco el formato: exportá el listado de Presupuestos de Venta de Xubio."); return; }
    const h=aoa[hi].map(c=>norm(String(c).trim())); const col=re=>h.findIndex(x=>re.test(x));
    const cF=col(/^fecha$/), cV=col(/^fecha vto/), cD=col(/^documento$/), cC=col(/^cliente$/), cT=col(/^total mon/), cT2=col(/^total$/), cE=col(/^estado$/), cO=col(/^observaciones$/);
    const filas=[];
    for(const r of aoa.slice(hi+1)){
      const m=String(r[cD]||"").match(/(\d+)\s*$/); if(!m) continue;
      const f=fechaX(r[cF]); if(!f) continue; const v=fechaX(r[cV])||f;
      const total=Math.round((Number(r[cT>=0?cT:cT2])||Number(r[cT2])||0)*100)/100;
      filas.push({num:+m[1],fecha:mediodia(f),validez:Math.max(1,Math.round((mediodia(v)-mediodia(f))/864e5)),cliente:String(r[cC]||"").trim(),total,estado:estadoXubio(r[cE]),notas:String(r[cO]||"").trim()});
    }
    if(!filas.length){ toast("El archivo no tiene presupuestos."); return; }
    const nuevos=filas.filter(x=>!S.cotiz.some(c=>c.id==="xubio_"+x.num)).length;
    confirmar(`Importar ${filas.length} presupuestos de Xubio (${nuevos} nuevos, ${filas.length-nuevos} se actualizan). Del Excel solo se toma el total, no el detalle de productos.`,async()=>{
      let n=0; const now=new Date().toISOString();
      const ok=await write(async()=>{ for(const x of filas){ const id="xubio_"+x.num, prev=S.cotiz.find(c=>c.id===id);
        const data={origen:"xubio",xubioNum:x.num,xubioCliente:x.cliente,fecha:x.fecha.toISOString(),validez:x.validez,total:x.total,subtotal:x.total,descuento:0,notas:x.notas,actualizado:now};
        if(!prev) await S.db.doc("cotizaciones/"+id).set({...data,clienteId:"",estado:x.estado,items:[],costo:0,margen:Number(S.cfg.margen)||15});
        else { const upd={...data}; if(!prev.pedidoId&&!["aceptada","rechazada"].includes(prev.estado)&&x.estado!=="enviada") upd.estado=x.estado; if(norm(prev.xubioCliente)!==norm(x.cliente)) upd.clienteId="";
          if((prev.items||[]).length){ delete upd.total; delete upd.subtotal; } await S.db.doc("cotizaciones/"+id).update(upd); }
        n++; } },null);
      if(ok){ toast(n+" presupuestos de Xubio importados"); vincularXubio(); }
    });
  }catch(e){ console.error(e); toast("No pude leer el archivo: "+(e.message||e)); }
}
// asigna cada presupuesto importado a su cliente (por nombre); si no existe, lo crea
let vinculando=false;
async function vincularXubio(){
  if(vinculando||!S.esDueno||!S.db||!S.ready) return;
  const pend=S.cotiz.filter(c=>c.origen==="xubio"&&!c.clienteId&&c.xubioCliente); if(!pend.length) return;
  vinculando=true;

// achica la foto antes de subirla (máx. 1600 px, JPEG) para que suba rápido con datos móviles
async function achicarFoto(file){
  const url=URL.createObjectURL(file);
  try{ const img=await new Promise((ok,mal)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=mal; i.src=url; });
    const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement("canvas");
    c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise((ok,mal)=>c.toBlob(b=>b?ok(b):mal(new Error("sin imagen")),"image/jpeg",0.78));
  }catch(e){ if(file.size<8e6) return file; throw e; } finally{ URL.revokeObjectURL(url); }
}
async function subirComprobante(blob,trabajoId){

// panel para firmar con el dedo (o el mouse)
function padFirma(cv){
  if(!cv) return {vacia:()=>true,limpiar(){},ajustar(){},blob:async()=>null};
  const ctx=cv.getContext("2d"); let trazos=0, dibujando=false, ult=null;
  const ajustar=()=>{ const r=cv.getBoundingClientRect(); if(!r.width) return; const dpr=window.devicePixelRatio||1;
    cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,r.width,r.height); ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#111827"; ctx.lineWidth=2.4; trazos=0; cv.parentNode.classList.remove("firmado"); };
  const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  cv.addEventListener("pointerdown",e=>{ e.preventDefault(); cv.setPointerCapture&&cv.setPointerCapture(e.pointerId); dibujando=true; ult=pos(e); ctx.beginPath(); ctx.arc(ult.x,ult.y,1.2,0,Math.PI*2); ctx.fillStyle="#111827"; ctx.fill(); });
  cv.addEventListener("pointermove",e=>{ if(!dibujando) return; e.preventDefault(); const p=pos(e); ctx.beginPath(); ctx.moveTo(ult.x,ult.y); ctx.lineTo(p.x,p.y); ctx.stroke(); ult=p; trazos++; cv.parentNode.classList.add("firmado"); });
  const fin=()=>{ dibujando=false; }; cv.addEventListener("pointerup",fin); cv.addEventListener("pointercancel",fin); cv.addEventListener("pointerleave",fin);
  setTimeout(ajustar,30);
  return { vacia:()=>trazos<3, limpiar:ajustar, ajustar:()=>setTimeout(ajustar,30), blob:()=>new Promise((ok,mal)=>cv.toBlob(b=>b?ok(b):mal(new Error("sin firma")),"image/png")) };
}

// ganancia real = total vendido − costo de los equipos del proveedor − gastos cargados
function resultadoPed(p){
  const costo=(p.items||[]).reduce((a,i)=>a+(Number(i.costo)||0)*(Number(i.cant)||0),0);
  const gastos=(p.gastos||[]).reduce((a,g)=>a+(Number(g.importe)||0),0);
  return {costo,gastos,ganancia:(Number(p.total)||0)-costo-gastos};
}

// número de WhatsApp en formato internacional argentino (549 + característica + número)
function waNumero(v){
  let d=String(v||"").replace(/\D/g,""); if(!d) return "";
  if(d.startsWith("00")) d=d.slice(2);
  if(d.startsWith("54")){ d=d.slice(2); if(d.startsWith("9")) d=d.slice(1); }
  if(d.startsWith("0")) d=d.slice(1);
  return "549"+d;
}
/* proveedores a los que se les puede pedir por WhatsApp */
const esGelin = i => i.prov==="gelin"||String(i.key||"").startsWith("G:");
const PROVS={
  ts:{nombre:()=>S.cfg.provNombre||"Todo Seguridad", wa:()=>S.cfg.provWhatsapp, campo:"provEnviado", items:p=>(p.items||[]).filter(i=>!i.propio&&!String(i.key||"").startsWith("P:")&&!esGelin(i)),
      total:its=>money(its.reduce((a,i)=>a+(Number(i.costo)||0)*i.cant,0))},
  gelin:{nombre:()=>S.cfg.gelinNombre||"Gelin Group", wa:()=>S.cfg.gelinWhatsapp, campo:"gelinEnviado", items:p=>(p.items||[]).filter(esGelin),
      total:its=>"US$ "+fmtUsd(its.reduce((a,i)=>a+(Number(i.usd)||0)*i.cant,0))}
};
const provsDe = p => Object.keys(PROVS).filter(k=>PROVS[k].items(p).length);
const itemsProveedor = p => provsDe(p).flatMap(k=>PROVS[k].items(p));
function textoProveedor(p,k){
  const P=PROVS[k], its=P.items(p);
  return `Hola ${P.nombre()}! Soy ${S.cfg.empresa||"JAI Seguridad"}. Quiero hacer el siguiente pedido:\n\n`+
    its.map(i=>`• ${i.cant} x ${i.codigo}${i.marca&&i.marca!=="OUTLET"?" ("+i.marca+")":""}`).join("\n")+
    `\n\n${its.reduce((a,i)=>a+i.cant,0)} unidades · Total según su lista: ${P.total(its)}\nReferencia: ${pedNum(p.numero)}\n¡Gracias!`;
}
function linkProveedor(p,k){ return "https://wa.me/"+waNumero(PROVS[k].wa())+"?text="+encodeURIComponent(textoProveedor(p,k)); }
function botonProveedor(p,cls){
  return provsDe(p).map(k=>`<a class="wa ${cls||""}" href="${esc(linkProveedor(p,k))}" target="_blank" rel="noopener" data-wa="${esc(p.id)}" data-prov="${k}">${p[PROVS[k].campo]?"Reenviar a ":"Pedir a "}${esc(PROVS[k].nombre())}</a> <button class="sm ${cls||""}" data-mailped="${esc(p.id)}" data-prov="${k}" title="Enviar el pedido por email">✉ Email</button>`).join(" ");
}
// al pedirle la mercadería al proveedor: se marca el pedido como enviado y se carga la compra en su cuenta corriente
async function cargarCompraAuto(p,prov){
  if(p.estado==="cancelado") return false;
  if(S.movProv.some(m=>m.provId===prov&&m.pedidoId===p.id&&m.auto&&m.tipo==="compra")) return false;
  const c=compraDePedido(p,prov); if(!(c.total>0)) return false;
  await S.db.doc("movProv/auto_"+p.id+"_"+prov).set({provId:prov,fecha:new Date().toISOString(),tipo:"compra",concepto:"Compra "+pedNum(p.numero)+" ("+cliNombre(p.clienteId)+")",importe:c.total,moneda:prov==="gelin"?"USD":"ARS",detalle:c.detalle,pedidoId:p.id,auto:true});
  return true;
}
function marcarEnviado(el){ el.querySelectorAll("[data-wa]").forEach(a=>a.addEventListener("click",()=>{
  const p=S.pedidos.find(x=>x.id===a.dataset.wa); const prov=a.dataset.prov; const campo=PROVS[prov]?.campo; if(!p||!campo) return;
  const yaCargada=S.movProv.some(m=>m.provId===prov&&m.pedidoId===p.id&&m.auto&&m.tipo==="compra");
  if(p[campo]&&yaCargada) return;
  let cargo=false;
  write(async()=>{
    if(!p[campo]) await S.db.doc("pedidos/"+p.id).update({[campo]:new Date().toISOString()});
    cargo=await cargarCompraAuto(p,prov);
  }).then(ok=>{ if(ok&&cargo){ const c=compraDePedido(p,prov); toast("Compra cargada en la cuenta de "+PROVS[prov].nombre()+": "+fmtMon(c.total,prov==="gelin"?"USD":"ARS")); } });
})); }

      await S.db.doc("pedidos/"+p.id).update({estado:nuevo});

      if(nuevo==="cancelado"&&p.estado!=="cancelado") await S.db.collection("movimientos").doc().set({clienteId:p.clienteId,fecha:new Date().toISOString(),tipo:"pago",concepto:"Anulación pedido "+pedNum(p.numero),importe:p.total,pedidoId:p.id,anulacion:true});

      // lo mismo con la cuenta de los proveedores: se anula la compra cargada automáticamente, o se vuelve a cargar
      for(const prov of ["ts","gelin"]){

        if(p.estado==="cancelado"&&nuevo!=="cancelado"&&ms.length&&neto<=0.005){ const c=compraDePedido(p,prov); if(c.total>0) await S.db.collection("movProv").doc().set({provId:prov,fecha:new Date().toISOString(),tipo:"compra",concepto:"Reactivación "+pedNum(p.numero),importe:c.total,moneda:prov==="gelin"?"USD":"ARS",detalle:c.detalle,pedidoId:p.id,auto:true}); }
      }
    },"Pedido "+pedNum(p.numero)+": "+ESTADOS_PED[nuevo][0]);
  });
}

/* ---------- Importar clientes desde Xubio ---------- */
const XCAMPOS=[
  ["nombre","Nombre / Razón social",["razon social","nombre","cliente","denominacion"]],
  ["cuit","CUIT / DNI",["cuit","cuil","numero de identificacion","nro de identificacion","nro. de identificacion","identificacion","numero de documento","nro documento","documento","dni"]],
  ["condIva","Condición IVA",["condicion iva","condicion frente al iva","categoria fiscal","condicion fiscal","categoria impositiva","responsabilidad","iva"]],
  ["telefono","Teléfono",["telefono","celular","movil","tel"]],
  ["email","Email",["e-mail","email","mail","correo"]],
  ["direccion","Dirección",["direccion","domicilio","calle"]],
  ["localidad","Localidad",["localidad","ciudad"]],
  ["provincia","Provincia",["provincia"]],
  ["codigo","Código en Xubio",["codigo"]],
  ["saldo","Saldo",["saldo"]]
];
const cuitKey = v => { const d=String(v||"").replace(/\D/g,""); return d.length>=7?d:""; };
const cliKey = c => cuitKey(c.cuit)||("n:"+norm(c.nombre).replace(/\s+/g," ").trim());
function parseNum(v){ if(typeof v==="number") return v; let s=String(v||"").trim(); if(!s) return 0; const neg=/\(.*\)/.test(s)||s.includes("-"); s=s.replace(/[^\d,.]/g,"");
  const lc=s.lastIndexOf(","), ld=s.lastIndexOf(".");
  if(lc>=0&&ld>=0){ s= lc>ld ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,""); }
  else if(lc>=0){ s= s.match(/,/g).length>1 ? s.replace(/,/g,"") : s.replace(",","."); }
  else if(ld>=0){ if(s.match(/\./g).length>1||/^\d{1,3}\.\d{3}$/.test(s)) s=s.replace(/\./g,""); }
  const n=Number(s)||0; return neg?-n:n; }
// palabras que descartan una columna para un campo (ej. "Tipo de identificación" no es el CUIT)
const XEXCL={cuit:["tipo"],nombre:["fantasia"],codigo:["postal","area","barra"],precio:["compra","costo"],categoria:["fiscal","iva"]};
function detectarColumnas(headers,campos=XCAMPOS){
  const h=headers.map(x=>norm(x).replace(/\s+/g," ").trim()); const used=new Set(); const map={};
  for(const [k,,syn] of campos){
    let idx=-1; const ex=XEXCL[k]||[];
    for(const s of syn){ idx=h.findIndex((c,i)=>!used.has(i)&&c&&(c===s||c.includes(s))&&!ex.some(x=>c.includes(x))); if(idx>=0) break; }
    map[k]=idx; if(idx>=0) used.add(idx);
  }
  return map;
}
async function leerExcel(file,campos,queEs){
  if(!window.XLSX) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
  const wb=/\.csv$/i.test(file.name)?XLSX.read(await file.text(),{type:"string"}):XLSX.read(await file.arrayBuffer());
  const ws=wb.Sheets[wb.SheetNames[0]];
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true});
  // la fila de encabezados es la que más columnas conocidas reconoce (Xubio suele poner títulos arriba)
  let hi=-1,best=0;
  for(let i=0;i<Math.min(25,aoa.length);i++){ const m=detectarColumnas(aoa[i],campos); const sc=Object.values(m).filter(x=>x>=0).length; if(sc>best){best=sc;hi=i;} }
  if(hi<0||best<2) throw new Error("no encontré los encabezados. Revisá que sea el listado de "+queEs+".");
  const headers=aoa[hi].map(x=>String(x).trim());
  const rows=aoa.slice(hi+1).filter(r=>r.some(c=>String(c).trim()!==""));
  return {headers,rows,map:detectarColumnas(headers,campos)};
}
async function leerClientesExcel(file){
  try{ const {headers,rows,map}=await leerExcel(file,XCAMPOS,"clientes"); modalImportClientes(file.name,headers,rows,map); }
  catch(e){ toast("No pude leer el archivo: "+e.message); }
}
function modalImportClientes(fname,headers,rows,map){
  const opts=sel=>`<option value="-1">— no importar —</option>`+headers.map((h,i)=>`<option value="${i}" ${i===sel?"selected":""}>${esc(h||("Columna "+(i+1)))}</option>`).join("");
  modal(`<h2>Importar clientes de Xubio</h2>
    <p class="muted" style="margin:0">${esc(fname)} · ${rows.length} filas. Revisá qué columna corresponde a cada dato.</p>
    <div class="fgrid">${XCAMPOS.map(([k,l])=>`<label class="f">${l}<select id="xm_${k}">${opts(map[k])}</select></label>`).join("")}</div>
    <div id="xmSaldo"></div>
    <div id="xmPrev"></div>
    <div class="row" style="justify-content:flex-end"><button data-close>Cancelar</button><button class="pri" id="xmOk">Importar</button></div>`,
  m=>{
    const cur=()=>{ const o={}; XCAMPOS.forEach(([k])=>o[k]=+$("#xm_"+k,m).value); return o; };
    const parse=()=>{ const mp=cur(); const v=(r,k)=>mp[k]>=0?String(r[mp[k]]??"").trim():""; const out=new Map();
      for(const r of rows){ const nombre=v(r,"nombre"); if(!nombre||/^total/i.test(nombre)) continue;
        const c={nombre,cuit:v(r,"cuit"),condIva:v(r,"condIva"),telefono:v(r,"telefono"),email:v(r,"email"),direccion:v(r,"direccion"),localidad:[v(r,"localidad"),v(r,"provincia")].filter(Boolean).join(", "),codXubio:v(r,"codigo"),saldo:mp.saldo>=0?parseNum(r[mp.saldo]):0};
        out.set(cliKey(c),c); }
      return [...out.values()]; };
    const prev=()=>{
      const list=parse(); const exist=new Map(S.clientes.map(c=>[cliKey(c),c]));
      const nuevos=list.filter(c=>!exist.has(cliKey(c))).length; const conSaldo=list.filter(c=>Math.abs(c.saldo)>0.5).length;
      $("#xmPrev",m).innerHTML=`<div class="banner info">${list.length} clientes: <b>${nuevos} nuevos</b> y <b>${list.length-nuevos} ya cargados</b> (se completan sus datos, sin duplicarlos).</div>
        <div class="tbl-wrap"><table><thead><tr><th>Nombre</th><th>CUIT</th><th>Teléfono</th><th>Email</th>${cur().saldo>=0?`<th class="r">Saldo</th>`:""}</tr></thead><tbody>${list.slice(0,5).map(c=>`<tr><td>${esc(c.nombre)}</td><td class="mono">${esc(c.cuit)}</td><td>${esc(c.telefono)}</td><td>${esc(c.email)}</td>${cur().saldo>=0?`<td class="r num">${money(c.saldo)}</td>`:""}</tr>`).join("")}</tbody></table></div>${list.length>5?`<p class="muted" style="font-size:13px;margin:4px 0 0">Mostrando 5 de ${list.length}.</p>`:""}`;
      $("#xmSaldo",m).innerHTML=cur().saldo>=0?`<div class="panel" style="padding:12px;display:flex;flex-direction:column;gap:8px">
        <label class="row"><input type="checkbox" id="xmUseSaldo" ${conSaldo?"checked":""}> Cargar el saldo como <b>saldo inicial</b> de la cuenta corriente (${conSaldo} clientes con saldo)</label>
        <label class="row muted" style="font-size:13.5px">Un saldo positivo en Xubio significa <select id="xmSigno"><option value="1">que el cliente me debe</option><option value="-1">saldo a favor del cliente</option></select></label>
        <span class="muted" style="font-size:12.5px">Solo se carga en clientes que todavía no tienen movimientos en el dashboard, para no duplicar deudas.</span></div>`:"";
    };
    XCAMPOS.forEach(([k])=>$("#xm_"+k,m).onchange=prev); prev();
    $("#xmOk",m).onclick=async()=>{
      if(+$("#xm_nombre",m).value<0){ toast("Elegí qué columna tiene el nombre del cliente."); return; }
      const list=parse(); if(!list.length){ toast("No encontré clientes con nombre en el archivo."); return; }
      const useSaldo=$("#xmUseSaldo",m)?.checked; const signo=+($("#xmSigno",m)?.value||1);
      const btn=$("#xmOk",m); btn.disabled=true;
      const exist=new Map(S.clientes.map(c=>[cliKey(c),c])); const conMovs=new Set(S.movs.map(x=>x.clienteId));
      let nuevos=0,act=0,saldos=0,err=0,done=0; const now=new Date().toISOString();
      const tarea=async c=>{
        const ex=exist.get(cliKey(c)); const campos={}; ["nombre","cuit","condIva","telefono","email","direccion","localidad","codXubio"].forEach(k=>{ if(c[k]) campos[k]=c[k]; });
        let id;
        if(ex){ id=ex.id; await S.db.doc("clientes/"+id).update(campos); act++; }
        else { const ref=S.db.collection("clientes").doc(); id=ref.id; await ref.set({nombre:"",cuit:"",condIva:"",telefono:"",email:"",direccion:"",localidad:"",notas:"",...campos,origen:"xubio",creado:now}); nuevos++; }
        const s=c.saldo*signo;
        if(useSaldo&&Math.abs(s)>0.5&&!conMovs.has(id)){ await S.db.collection("movimientos").doc().set({clienteId:id,fecha:now,tipo:s>0?"cargo":"pago",concepto:"Saldo inicial importado de Xubio",importe:Math.round(Math.abs(s)*100)/100,saldoInicial:true}); saldos++; }
      };
      for(let i=0;i<list.length;i+=8){
        await Promise.all(list.slice(i,i+8).map(c=>tarea(c).catch(e=>{ err++; console.error(e); })));
        done=Math.min(list.length,i+8); btn.textContent="Importando "+done+" de "+list.length+"…";
      }
      closeModal();
      toast(`Listo: ${nuevos} clientes nuevos, ${act} actualizados${saldos?`, ${saldos} saldos iniciales`:""}${err?` · ${err} con error`:""}.`);
    };
  });
}

async function leerPropiosExcel(file){
  try{ const {headers,rows,map}=await leerExcel(file,PCAMPOS,"productos"); modalImportPropios(file.name,headers,rows,map); }
  catch(e){ toast("No pude leer el archivo: "+e.message); }
}
function modalImportPropios(fname,headers,rows,map){
  const opts=sel=>`<option value="-1">— no importar —</option>`+headers.map((h,i)=>`<option value="${i}" ${i===sel?"selected":""}>${esc(h||("Columna "+(i+1)))}</option>`).join("");
  modal(`<h2>Importar productos propios</h2>
    <p class="muted" style="margin:0">${esc(fname)} · ${rows.length} filas. Revisá qué columna corresponde a cada dato. Si solo hay costo, el precio se calcula con el margen general (${S.cfg.margen}%).</p>
    <div class="fgrid">${PCAMPOS.map(([k,l])=>`<label class="f">${l}<select id="xp_${k}">${opts(map[k])}</select></label>`).join("")}</div>
    <label class="row" style="font-size:14px"><input type="checkbox" id="xpPrune"> Borrar los productos propios que no estén en este archivo</label>
    <div id="xpPrev"></div>
    <div class="row" style="justify-content:flex-end"><button data-close>Cancelar</button><button class="pri" id="xpOk">Importar</button></div>`,
  m=>{
    const cur=()=>{ const o={}; PCAMPOS.forEach(([k])=>o[k]=+$("#xp_"+k,m).value); return o; };
    const parse=()=>{ const mp=cur(); const v=(r,k)=>mp[k]>=0?String(r[mp[k]]??"").trim():""; const out=new Map();
      for(const r of rows){ let nombre=v(r,"nombre"); const extra=v(r,"descripcion"); if(extra&&norm(extra)!==norm(nombre)) nombre=nombre?nombre+" – "+extra:extra;
        const codigo=v(r,"codigo"); if(!nombre&&!codigo) continue; if(/^total/i.test(nombre)) continue;
        const p={codigo,nombre:(nombre||codigo).slice(0,300),marca:v(r,"marca"),categoria:v(r,"categoria"),costo:Math.max(0,Math.round(mp.costo>=0?parseNum(r[mp.costo]):0)),precio:Math.max(0,Math.round(mp.precio>=0?parseNum(r[mp.precio]):0))};
        out.set(propKey(p),p); }
      return [...out.values()]; };
    const prev=()=>{
      const list=parse(); const exist=new Map(S.propios.map(p=>[propKey(p),p])); const keys=new Set(list.map(propKey));
      const nuevos=list.filter(p=>!exist.has(propKey(p))).length; const borrar=S.propios.filter(p=>!keys.has(propKey(p))).length;
      const sinP=list.filter(p=>!p.precio&&!p.costo).length;
      $("#xpPrev",m).innerHTML=`<div class="banner info">${list.length} productos: <b>${nuevos} nuevos</b> y <b>${list.length-nuevos} ya cargados</b> (se actualizan).${$("#xpPrune",m).checked&&borrar?` Se borran ${borrar} que no están en el archivo.`:""}${sinP?` ${sinP} sin precio.`:""}</div>
        <div class="tbl-wrap"><table><thead><tr><th>Código</th><th>Producto</th><th class="r">Costo</th><th class="r">Venta</th></tr></thead><tbody>${list.slice(0,5).map(p=>{ const pv=p.precio||Math.round(p.costo*(1+S.cfg.margen/100)); return `<tr><td class="mono">${esc(p.codigo)}</td><td>${esc(p.nombre)}</td><td class="r num">${p.costo?money(p.costo):"—"}</td><td class="r num">${pv?money(pv):"Consultar"}</td></tr>`; }).join("")}</tbody></table></div>${list.length>5?`<p class="muted" style="font-size:13px;margin:4px 0 0">Mostrando 5 de ${list.length}.</p>`:""}`;
    };
    PCAMPOS.forEach(([k])=>$("#xp_"+k,m).onchange=prev); $("#xpPrune",m).onchange=prev; prev();
    $("#xpOk",m).onclick=async()=>{
      if(+$("#xp_nombre",m).value<0&&+$("#xp_codigo",m).value<0){ toast("Elegí qué columna tiene el nombre del producto."); return; }
      const list=parse(); if(!list.length){ toast("No encontré productos en el archivo."); return; }
      const prune=$("#xpPrune",m).checked; const btn=$("#xpOk",m); btn.disabled=true;
      const exist=new Map(S.propios.map(p=>[propKey(p),p])); const keys=new Set(list.map(propKey)); const now=new Date().toISOString();
      let nuevos=0,act=0,borr=0,err=0;
      const tarea=async p=>{ const ex=exist.get(propKey(p));
        if(ex){ const upd={nombre:p.nombre,actualizado:now}; ["codigo","marca","categoria"].forEach(k=>{ if(p[k]) upd[k]=p[k]; }); if(+$("#xp_costo",m).value>=0) upd.costo=p.costo; if(+$("#xp_precio",m).value>=0) upd.precio=p.precio; await S.db.doc("propios/"+ex.id).update(upd); act++; }
        else { await S.db.collection("propios").doc().set({...p,margen:null,origen:"importado",actualizado:now}); nuevos++; } };
      for(let i=0;i<list.length;i+=8){ await Promise.all(list.slice(i,i+8).map(p=>tarea(p).catch(e=>{err++; console.error(e);}))); btn.textContent="Importando "+Math.min(list.length,i+8)+" de "+list.length+"…"; }
      if(prune){ const del=S.propios.filter(p=>!keys.has(propKey(p))); for(let i=0;i<del.length;i+=8){ await Promise.all(del.slice(i,i+8).map(p=>S.db.doc("propios/"+p.id).delete().then(()=>borr++).catch(e=>{err++; console.error(e);}))); } }
      closeModal(); toast(`Listo: ${nuevos} productos nuevos, ${act} actualizados${borr?`, ${borr} borrados`:""}${err?` · ${err} con error`:""}.`);
    };
  });
}
