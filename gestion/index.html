// Todo Seguridad (pesos) y Gelin (dólares) vienen fijos; los demás se guardan en "proveedores"
function listaProvs(){
  return [{id:"ts",nombre:S.cfg.provNombre||"Todo Seguridad",moneda:"ARS",fijo:true,wa:S.cfg.provWhatsapp},{id:"gelin",nombre:S.cfg.gelinNombre||"Gelin Group",moneda:"USD",fijo:true,wa:S.cfg.gelinWhatsapp},
    ...S.provs.slice().sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre))).map(p=>({...p,moneda:p.moneda||"ARS"}))];
}
const TIPOS_MP={compra:["Compra","p-warn",1],pago:["Pago","p-good",-1],credito:["Nota de crédito","p-info",-1],ajuste:["Ajuste (+)","p-mut",1]};
const saldoProv = id => S.movProv.filter(m=>m.provId===id).reduce((a,m)=>a+((TIPOS_MP[m.tipo]||TIPOS_MP.compra)[2])*(Number(m.importe)||0),0);
function deudaProveedores(){ let ars=0,usd=0; listaProvs().forEach(p=>{ const s=saldoProv(p.id); if(s>0) (p.moneda==="USD"?usd+=s:ars+=s); }); return {ars,usd}; }
const fmtMon = (n,mon) => mon==="USD" ? "US$ "+fmtUsd(n) : money(n);
// lo que un pedido le compra a un proveedor, en la moneda de su cuenta
function compraDePedido(p,provId){
  const its=(p.items||[]).filter(i=>provId==="gelin"?esGelin(i):provId==="ts"?(!i.propio&&!String(i.key||"").startsWith("P:")&&!esGelin(i)):false);
  const total=provId==="gelin"?its.reduce((a,i)=>a+(Number(i.usd)||0)*i.cant,0):its.reduce((a,i)=>a+(Number(i.costo)||0)*i.cant,0);
  return {its,total:Math.round(total*100)/100,detalle:its.map(i=>i.cant+"× "+i.codigo).join(", ")};
}
function rProveedores(el){
  const ps=listaProvs(); if(!ps.find(p=>p.id===S.selProv)) S.selProv="ts";
  const sel=ps.find(p=>p.id===S.selProv); const d=deudaProveedores();
  el.innerHTML=`<div class="head"><div><h1>Cuentas con proveedores</h1><div class="muted">Mercadería que pedís, pagos que hacés y cuánto debés a cada proveedor.</div></div><button class="pri" id="pvNew">Agregar proveedor</button></div>
  <div class="grid g4">
    <div class="tile alert"><span class="k">Debo en pesos</span><span class="v">${money(d.ars)}</span></div>
    <div class="tile acc"><span class="k">Debo en dólares</span><span class="v">US$ ${fmtUsd(d.usd)}</span><span class="s">${tcGelin()?"≈ "+money(d.usd*tcGelin())+" al dólar "+money(tcGelin()):""}</span></div>
  </div>
  <div class="grid split" style="grid-template-columns:minmax(220px,300px) minmax(0,1fr);align-items:start">
    <div class="panel"><table><tbody>${ps.map(p=>{ const s=saldoProv(p.id); return `<tr class="click" data-pv="${esc(p.id)}" ${p.id===S.selProv?'style="background:var(--accent-soft)"':""}><td>${esc(p.nombre)}<div class="muted" style="font-size:12px">${p.moneda==="USD"?"Cuenta en dólares":"Cuenta en pesos"}</div></td><td class="r num ${s>0.005?"saldo-pos":s<-0.005?"saldo-neg":"muted"}">${fmtMon(s,p.moneda)}</td></tr>`; }).join("")}</tbody></table></div>
    <div class="panel" id="pvDet">${detalleProv(sel)}</div>
  </div>`;
  $("#pvNew",el).onclick=()=>modalProv();
  el.querySelectorAll("[data-pv]").forEach(r=>r.onclick=()=>{S.selProv=r.dataset.pv; render();});
  $("#pvCompra",el).onclick=()=>modalMovProv(sel,"compra"); $("#pvPago",el).onclick=()=>modalMovProv(sel,"pago"); $("#pvNC",el).onclick=()=>modalMovProv(sel,"credito");
  const ed=$("#pvEdit",el); if(ed) ed.onclick=()=>modalProv(sel);
  el.querySelectorAll("[data-delmp]").forEach(b=>b.onclick=()=>confirmar("¿Borrar este movimiento de la cuenta del proveedor?",()=>write(()=>S.db.doc("movProv/"+b.dataset.delmp).delete(),"Movimiento borrado")));
}
function detalleProv(p){
  const s=saldoProv(p.id); let run=0;
  const movs=S.movProv.filter(m=>m.provId===p.id).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))).map(m=>{ run+=((TIPOS_MP[m.tipo]||TIPOS_MP.compra)[2])*(Number(m.importe)||0); return {...m,run}; }).reverse();
  return `<div class="spread"><div><h2>${esc(p.nombre)}</h2><div class="muted" style="font-size:13px">${p.moneda==="USD"?"Cuenta en dólares":"Cuenta en pesos"}${p.cuit?" · CUIT "+esc(p.cuit):""}${p.telefono||p.wa?" · "+esc(p.telefono||p.wa):""}</div></div>
    <div style="text-align:right"><div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600">Saldo</div><div class="num ${s>0.005?"saldo-pos":s<-0.005?"saldo-neg":""}" style="font:800 24px var(--display)">${fmtMon(Math.abs(s),p.moneda)}</div><div class="muted" style="font-size:12px">${s>0.005?"le debés":s<-0.005?"a tu favor":"al día"}${p.moneda==="USD"&&s>0.005&&tcGelin()?" · ≈ "+money(s*tcGelin()):""}</div></div></div>
  <div class="row" style="margin:12px 0"><button class="sm" id="pvCompra">Registrar compra</button><button class="pri sm" id="pvPago">Registrar pago</button><button class="sm" id="pvNC">Nota de crédito</button>${p.fijo?"":`<button class="ghost sm" id="pvEdit">Editar proveedor</button>`}</div>
  ${movs.length?`<div class="tbl-wrap cards"><table><thead><tr><th>Fecha</th><th>Concepto</th><th class="r">Compras</th><th class="r">Pagos</th><th class="r">Saldo</th><th></th></tr></thead><tbody>${movs.map(m=>{ const t=TIPOS_MP[m.tipo]||TIPOS_MP.compra; return `<tr>
    <td class="num">${fdate(m.fecha)}</td>
    <td><span class="pill ${t[1]}">${t[0]}</span> ${esc(m.concepto)}${m.auto?` <span class="muted" style="font-size:12px" title="Cargado al pedir la mercadería por WhatsApp">· automático</span>`:""}${m.comprobante?` <span class="muted" style="font-size:12.5px">· Comp. ${esc(m.comprobante)}</span>`:""}${m.medio?` <span class="muted" style="font-size:12.5px">· ${esc(m.medio)}</span>`:""}${m.pesos&&p.moneda==="USD"?` <span class="muted" style="font-size:12.5px">· pagado ${money(m.pesos)} a ${money(m.tc)}</span>`:""}${m.detalle?`<div class="muted" style="font-size:12px">${esc(m.detalle).slice(0,160)}</div>`:""}</td>
    <td class="r num">${t[2]>0?fmtMon(m.importe,p.moneda):""}</td><td class="r num" style="color:var(--good)">${t[2]<0?fmtMon(m.importe,p.moneda):""}</td>
    <td class="r num ${m.run>0.005?"saldo-pos":""}">${fmtMon(m.run,p.moneda)}</td><td><button class="ghost sm" data-delmp="${esc(m.id)}" aria-label="Borrar">✕</button></td></tr>`; }).join("")}</tbody></table></div>`
    :`<div class="empty">Sin movimientos. Empezá con «Registrar compra» o cargá el saldo que ya tenés con «Registrar compra» → concepto «Saldo inicial».</div>`}
  ${p.notas?`<p class="muted" style="font-size:13.5px;margin-top:12px">Notas: ${esc(p.notas)}</p>`:""}`;
}
function modalProv(p){
  p=p||{};
  modal(`<h2>${p.id?"Editar proveedor":"Agregar proveedor"}</h2>
    <div class="fgrid">
      <label class="f full">Nombre<input id="mpvN" value="${esc(p.nombre)}"></label>
      <label class="f">Moneda de la cuenta<select id="mpvM"><option value="ARS" ${p.moneda!=="USD"?"selected":""}>Pesos</option><option value="USD" ${p.moneda==="USD"?"selected":""}>Dólares</option></select></label>
      <label class="f">CUIT<input id="mpvC" value="${esc(p.cuit)}"></label>
      <label class="f full">Teléfono / WhatsApp<input id="mpvT" value="${esc(p.telefono)}"></label>
      <label class="f full">Notas<textarea id="mpvNo" rows="2">${esc(p.notas)}</textarea></label>
    </div>
    <div class="row" style="justify-content:space-between">${p.id?`<button class="ghost sm" id="mpvDel">Borrar proveedor</button>`:"<span></span>"}<div class="row"><button data-close>Cancelar</button><button class="pri" id="mpvOk">Guardar</button></div></div>`,
  m=>{ $("#mpvN",m).focus();
    $("#mpvOk",m).onclick=async()=>{ const nombre=$("#mpvN",m).value.trim(); if(!nombre){ toast("Escribí el nombre del proveedor."); return; }
      const data={nombre,moneda:$("#mpvM",m).value,cuit:$("#mpvC",m).value.trim(),telefono:$("#mpvT",m).value.trim(),notas:$("#mpvNo",m).value.trim(),creado:p.creado||new Date().toISOString()};
      const ref=p.id?S.db.doc("proveedores/"+p.id):S.db.collection("proveedores").doc();
      if(await write(()=>ref.set(data),"Proveedor guardado")){ S.selProv=ref.id; closeModal(); render(); } };
    const del=$("#mpvDel",m); if(del) del.onclick=()=>{ if(S.movProv.some(x=>x.provId===p.id)){ toast("Tiene movimientos: borralos primero."); return; } confirmar("¿Borrar el proveedor "+p.nombre+"?",()=>write(()=>S.db.doc("proveedores/"+p.id).delete(),"Proveedor borrado").then(()=>{ S.selProv="ts"; render(); })); };
  });
}
function modalMovProv(p,tipo){
  const usd=p.moneda==="USD", tc=tcGelin(), s=saldoProv(p.id);
  const fijo=p.id==="ts"||p.id==="gelin";
  const esPropioIt = i => i.propio||String(i.key||"").startsWith("P:")||String(i.key||"").startsWith("V:");
  const peds=fijo?S.pedidos.filter(x=>x.estado!=="cancelado").map(x=>({x,c:compraDePedido(x,p.id)})).filter(o=>o.c.total>0)
    :S.pedidos.filter(x=>x.estado!=="cancelado"&&(x.items||[]).some(i=>esPropioIt(i)&&Number(i.precio)>0)).map(x=>({x,c:{total:0}}));
  const yaCargados=new Set(S.movProv.filter(m=>m.provId===p.id&&m.pedidoId).map(m=>m.pedidoId));
  const tit={compra:"Registrar compra",pago:"Registrar pago",credito:"Nota de crédito"}[tipo];
  modal(`<h2>${tit} · ${esc(p.nombre)}</h2>
    <p class="muted" style="margin:0">Saldo actual: <b>${fmtMon(s,p.moneda)}</b> ${s>0.005?"(le debés)":""}</p>
    <div class="fgrid">
      ${tipo==="compra"&&peds.length?`<label class="f full">Desde un pedido (opcional)<select id="mxPed"><option value="">— Compra suelta —</option>${peds.map(o=>`<option value="${esc(o.x.id)}">${pedNum(o.x.numero)} · ${esc(cliNombre(o.x.clienteId))}${fijo?" · "+fmtMon(o.c.total,p.moneda):""}${yaCargados.has(o.x.id)?" (ya cargado)":""}</option>`).join("")}</select></label>
      ${fijo?"":`<div class="full hide" id="mxItsW"><div class="muted" style="font-size:13px;margin-bottom:4px">Tildá los productos propios de este pedido que le compraste a ${esc(p.nombre)} y revisá el costo:</div><div class="tbl-wrap"><table style="font-size:13px"><thead><tr><th></th><th>Producto</th><th class="r">Cant.</th><th class="r">Costo unit.</th><th class="r">Subtotal</th></tr></thead><tbody id="mxIts"></tbody></table></div></div>`}`:""}
      <label class="f">Fecha<input type="date" id="mxF" value="${today()}"></label>
      <label class="f">Importe en ${usd?"dólares (US$)":"pesos"}<input type="number" id="mxI" min="0" step="${usd?"0.01":"1"}" value="${tipo==="pago"&&s>0?(usd?s.toFixed(2):Math.round(s)):""}"></label>
      ${usd&&tipo==="pago"?`<label class="f">Pagado en pesos (opcional)<input type="number" id="mxARS" min="0" placeholder="Ej.: 500000"></label><label class="f">Tipo de cambio<input type="number" id="mxTC" min="0" step="0.5" value="${tc||""}"></label>`:""}
      <label class="f ${tipo==="pago"?"":"full"}">Concepto<input id="mxC" value="${tipo==="compra"?"Compra de mercadería":tipo==="pago"?"Pago":"Nota de crédito"}"></label>
      ${tipo==="pago"?`<label class="f">Medio<select id="mxM"><option>Transferencia</option><option>Efectivo</option><option>Mercado Pago</option><option>Cheque</option><option>E-cheq</option></select></label>`:""}
      <label class="f full">N° de comprobante (opcional)<input id="mxNro" placeholder="${tipo==="pago"?"Recibo o transferencia":"Factura o remito"}"></label>
      <label class="f full">Detalle (opcional)<textarea id="mxD" rows="2"></textarea></label>
    </div>
    <div class="row" style="justify-content:flex-end"><button data-close>Cancelar</button><button class="pri" id="mxOk">Guardar</button></div>`,
  m=>{
    const selP=$("#mxPed",m);
    let selIts=[];
    const drawIts=()=>{ const o=peds.find(o=>o.x.id===selP.value); const w=$("#mxItsW",m); if(!w) return; w.classList.toggle("hide",!o); if(!o) return;
      const its=(o.x.items||[]).map((i,k)=>({i,k})).filter(({i})=>esPropioIt(i)&&Number(i.precio)>0);
      $("#mxIts",m).innerHTML=its.map(({i,k})=>{ const s=selIts.find(x=>x.k===k); const otro=i.provAsig&&i.provAsig!==p.id?(listaProvs().find(x=>x.id===i.provAsig)||{}).nombre:""; return `<tr>
        <td><input type="checkbox" data-it="${k}" ${s?"checked":""} aria-label="Es de ${esc(p.nombre)}"></td>
        <td><div class="mono" style="font-size:12px;word-break:break-all">${esc(i.codigo)}</div>${otro?`<div class="muted" style="font-size:11.5px">ya asignado a ${esc(otro)}</div>`:i.provAsig===p.id?`<div class="muted" style="font-size:11.5px">ya cargado a este proveedor</div>`:""}</td>
        <td class="r num">${i.cant}</td>
        <td class="r"><input class="pu num" type="number" min="0" data-itc="${k}" value="${s?s.costo:(Number(i.costo)||"")}" placeholder="Costo" style="width:96px"></td>
        <td class="r num">${s?money(s.costo*i.cant):"—"}</td></tr>`; }).join("")||`<tr><td colspan="5" class="muted">Este pedido no tiene productos propios.</td></tr>`;
      const sumar=()=>{ const tot=selIts.reduce((a,s)=>a+s.costo*s.cant,0); $("#mxI",m).value=tot||""; $("#mxD",m).value=selIts.map(s=>s.cant+"× "+s.codigo).join(", "); };
      m.querySelectorAll("[data-it]").forEach(cb=>cb.onchange=()=>{ const k=+cb.dataset.it, it=o.x.items[k]; const cIn=m.querySelector(`[data-itc="${k}"]`);
        if(cb.checked){ const costo=Math.round(Number(cIn.value)||0); if(!costo){ toast("Cargá el costo de "+it.codigo+" (lo que le pagás a "+p.nombre+")."); cIn.focus(); } selIts.push({k,codigo:it.codigo,cant:Number(it.cant)||1,costo}); }
        else selIts=selIts.filter(x=>x.k!==k);
        sumar(); drawIts(); });
      m.querySelectorAll("[data-itc]").forEach(inp=>inp.onchange=()=>{ const k=+inp.dataset.itc; const s=selIts.find(x=>x.k===k); const v=Math.max(0,Math.round(Number(inp.value)||0));
        if(s){ s.costo=v; sumar(); drawIts(); } else if(v>0){ const it=o.x.items[k]; selIts.push({k,codigo:it.codigo,cant:Number(it.cant)||1,costo:v}); sumar(); drawIts(); } });
    };
    if(selP) selP.onchange=()=>{ selIts=[]; drawIts(); const o=peds.find(o=>o.x.id===selP.value); if(!o) return; if(!fijo){ $("#mxC",m).value="Compra "+pedNum(o.x.numero)+" ("+cliNombre(o.x.clienteId)+")"; if(yaCargados.has(o.x.id)) toast("Ojo: ya hay una compra de este pedido cargada a "+p.nombre+"."); return; } $("#mxI",m).value=o.c.total; $("#mxC",m).value="Compra "+pedNum(o.x.numero)+" ("+cliNombre(o.x.clienteId)+")"; $("#mxD",m).value=o.c.detalle; if(yaCargados.has(o.x.id)) toast("Ojo: ese pedido ya está cargado en la cuenta."); };
    const ars=$("#mxARS",m), tcI=$("#mxTC",m);
    if(ars) ars.oninput=tcI.oninput=()=>{ const a=Number(ars.value)||0, t=Number(tcI.value)||0; if(a>0&&t>0) $("#mxI",m).value=(a/t).toFixed(2); };
    $("#mxI",m).focus();
    $("#mxOk",m).onclick=async()=>{
      const imp=Math.round((Number($("#mxI",m).value)||0)*(usd?100:1))/(usd?100:1); if(!(imp>0)){ toast("Ingresá un importe mayor a cero."); return; }
      const data={provId:p.id,fecha:new Date($("#mxF",m).value+"T12:00:00").toISOString(),tipo,concepto:$("#mxC",m).value.trim()||TIPOS_MP[tipo][0],importe:imp,moneda:p.moneda,comprobante:$("#mxNro",m).value.trim(),detalle:$("#mxD",m).value.trim()};
      if(tipo==="pago") data.medio=$("#mxM",m).value;
      if(ars&&Number(ars.value)>0){ data.pesos=Math.round(Number(ars.value)); data.tc=Number(tcI.value)||0; }
      if(selP&&selP.value) data.pedidoId=selP.value;
      if(!fijo&&selIts.length&&selIts.some(s=>!s.costo)){ toast("Falta el costo de algún producto tildado."); return; }
      if(!fijo&&selIts.length) data.items=selIts.map(s=>({codigo:s.codigo,cant:s.cant,costo:s.costo}));
      const ok=await write(async()=>{
        await S.db.collection("movProv").doc().set(data);
        // en el pedido queda anotado de qué proveedor es cada producto y su costo, así la ganancia del pedido es real
        if(!fijo&&selIts.length){ const ped=S.pedidos.find(x=>x.id===selP.value); const items=(ped.items||[]).map((i,k)=>{ const s=selIts.find(x=>x.k===k); return s?{...i,costo:s.costo,provAsig:p.id,...(i.costoLista==null?{costoLista:Number(i.costo)||0}:{})}:i; });
          await S.db.doc("pedidos/"+ped.id).update({items,costo:items.reduce((a,i)=>a+(Number(i.costo)||0)*(Number(i.cant)||0),0)}); }
      },tit+" guardado");
      if(ok) closeModal();
    };
  });
}

/* ---------- Empleados ---------- */
const MODALIDADES=["Mensual","Quincenal","Semanal","Por día","Por hora","Por trabajo"];
const TIPOS_EMP={devengado:["A pagar","p-warn"],pago:["Pago","p-good"],adelanto:["Adelanto","p-info"],descuento:["Descuento","p-mut"]};
// saldo positivo = lo que le debo al empleado
const saldoEmp = id => S.pagosEmp.filter(m=>m.empleadoId===id).reduce((a,m)=>a+(m.tipo==="devengado"?1:-1)*(Number(m.importe)||0),0);
const mesActual = () => new Date().toLocaleDateString("es-AR",{month:"long",year:"numeric"});
function rEmpleados(el){
  if(!S.esDueno){ el.innerHTML=`<div class="empty">Esta sección es solo para el dueño.</div>`; return; }
  const emps=S.empleados.slice().sort((a,b)=>(a.activo===false)-(b.activo===false)||a.nombre.localeCompare(b.nombre));
  const sel=S.empleados.find(e=>e.id===S.selEmp);
  const mes=new Date().toISOString().slice(0,7);
  const aPagar=emps.reduce((a,e)=>a+Math.max(0,saldoEmp(e.id)),0);
  const pagadoMes=S.pagosEmp.filter(m=>(m.tipo==="pago"||m.tipo==="adelanto")&&String(m.fecha).startsWith(mes)).reduce((a,m)=>a+(Number(m.importe)||0),0);
  const adel=emps.reduce((a,e)=>a+Math.max(0,-saldoEmp(e.id)),0);
  el.innerHTML=`<div class="head"><div><h1>Empleados</h1><div class="muted">Sueldos, trabajos, adelantos y pagos. Solo lo ves vos.</div></div><button class="pri" id="eNew">Nuevo empleado</button></div>
  <div class="grid g4">
    <div class="tile alert"><span class="k">Pendiente de pago</span><span class="v">${money(aPagar)}</span><span class="s">${emps.filter(e=>saldoEmp(e.id)>0.5).length} empleado(s)</span></div>
    <div class="tile ok"><span class="k">Pagado este mes</span><span class="v">${money(pagadoMes)}</span><span class="s">Pagos y adelantos de ${mesActual()}</span></div>
    <div class="tile inf"><span class="k">Adelantos a descontar</span><span class="v">${money(adel)}</span><span class="s">Pagado de más, se descuenta del próximo</span></div>
  </div>
  <div class="grid split" style="grid-template-columns:minmax(240px,320px) minmax(0,1fr);align-items:start">
    <div class="panel">${emps.length?`<table><tbody>${emps.map(e=>{ const s=saldoEmp(e.id); return `<tr class="click" data-id="${esc(e.id)}" ${e.id===S.selEmp?'style="background:var(--accent-soft)"':""}><td>${esc(e.nombre)}${e.activo===false?` <span class="pill p-mut">Inactivo</span>`:""}<div class="muted" style="font-size:12.5px">${esc([e.puesto,e.modalidad].filter(Boolean).join(" · "))}</div></td><td class="r num ${s>0.5?"saldo-pos":s<-0.5?"saldo-neg":"muted"}">${money(s)}</td></tr>`; }).join("")}</tbody></table>`:`<div class="empty">Todavía no cargaste empleados.</div>`}</div>
    <div class="panel" id="empDet">${sel?detalleEmp(sel):`<div class="empty">Elegí un empleado para ver su cuenta.</div>`}</div>
  </div>`;
  $("#eNew",el).onclick=()=>modalEmp(null,id=>{S.selEmp=id; render();});
  el.querySelectorAll("tr[data-id]").forEach(r=>r.onclick=()=>{S.selEmp=r.dataset.id; render();});
  if(sel){
    $("#eDev",el).onclick=()=>modalMovEmp(sel,"devengado"); $("#ePago",el).onclick=()=>modalMovEmp(sel,"pago"); $("#eAdel",el).onclick=()=>modalMovEmp(sel,"adelanto");
    $("#eEdit",el).onclick=()=>modalEmp(sel);
    $("#eDel",el).onclick=()=>modalBorrarEmp(sel);
    el.querySelectorAll("[data-delpe]").forEach(b=>b.onclick=()=>confirmar("¿Borrar este movimiento?",()=>write(()=>S.db.doc("pagosEmp/"+b.dataset.delpe).delete(),"Movimiento borrado")));
  }
}
function detalleEmp(e){
  const s=saldoEmp(e.id); let run=0;
  const movs=S.pagosEmp.filter(m=>m.empleadoId===e.id).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))).map(m=>{ run+=(m.tipo==="devengado"?1:-1)*(Number(m.importe)||0); return {...m,run}; }).reverse();
  return `<div class="spread"><div><h2>${esc(e.nombre)}</h2><div class="muted" style="font-size:13.5px">${esc([e.puesto,e.modalidad&&e.monto?e.modalidad+" "+money(e.monto):e.modalidad,e.cuil&&"CUIL "+e.cuil,e.telefono,e.ingreso&&"Ingreso "+fdate(e.ingreso+"T12:00:00")].filter(Boolean).join(" · "))||"Sin datos"}</div></div>
    <div style="text-align:right"><div class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600">Saldo</div><div class="num ${s>0.5?"saldo-pos":s<-0.5?"saldo-neg":""}" style="font:800 24px var(--display)">${money(Math.abs(s))}</div><div class="muted" style="font-size:12px">${s>0.5?"le debés":s<-0.5?"adelantado (a descontar)":"al día"}</div></div></div>
  <div class="row" style="margin:12px 0"><button class="sm" id="eDev">Cargar sueldo / trabajo</button><button class="pri sm" id="ePago">Registrar pago</button><button class="sm" id="eAdel">Adelanto</button><button class="ghost sm" id="eEdit">Editar datos</button><button class="ghost sm danger" id="eDel">Borrar empleado</button></div>

const TIPOS_AG=["Service","Visita técnica","Instalación","Mantenimiento","Reparación","Otro"];
const ESTADOS_AG={pendiente:["Pendiente","p-warn"],en_proceso:["En proceso","p-info"],realizado:["Realizado","p-good"],cancelado:["Cancelado","p-bad"]};

// búsqueda de direcciones: abre Google Maps con lo escrito y permite pegar el link de la ubicación exacta
const esLinkMaps = v => /^https?:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps|(www\.)?google\.[a-z.]+\/maps|maps\.google\.)/i.test(String(v||"").trim());
const linkMaps = (dir,url) => url&&esLinkMaps(url)?url:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(dir||"");
function campoMaps(idDir,idUrl,url){
  return `<div class="mapsRow"><a class="btnlink sm" data-mapsbus="${idDir}" target="_blank" rel="noopener" href="#">🔎 Buscar en Google Maps</a>
    <input id="${idUrl}" value="${esc(url||"")}" placeholder="Pegá acá el link de la ubicación (Compartir → Copiar vínculo)" inputmode="url"></div>`;
}
function bindMaps(m,idDir,idUrl){
  const d=$("#"+idDir,m), u=$("#"+idUrl,m), a=m.querySelector(`[data-mapsbus="${idDir}"]`);
  const upd=()=>{ a.href=linkMaps(d.value, ""); a.classList.toggle("dim",!d.value.trim()); u.classList.toggle("ok",esLinkMaps(u.value)); };
  d.addEventListener("input",()=>{ if(esLinkMaps(d.value)){ u.value=d.value.trim(); d.value=""; toast("Guardé el link de la ubicación. Escribí la dirección para que se lea en la orden."); } upd(); });
  u.addEventListener("input",upd); a.addEventListener("click",e=>{ if(!d.value.trim()){ e.preventDefault(); toast("Escribí la calle y altura, y tocá buscar."); d.focus(); } }); upd();
}
const agAbierto = t => t.estado==="pendiente"||t.estado==="en_proceso";
const AVISOS_AG=[[0,"A la hora"],[15,"15 min antes"],[30,"30 min antes"],[60,"1 hora antes"],[120,"2 horas antes"],[1440,"1 día antes"]];
const agInicio = t => { const d=new Date((t.fecha||today())+"T"+(t.hora||"09:00")+":00"); return isNaN(d)?null:d; };
const agGastos = t => (t.gastos||[]).reduce((a,g)=>a+(Number(g.importe)||0),0);
const agAtrasado = t => t.estado==="pendiente" && agInicio(t) && agInicio(t) < new Date(Date.now()-60*60*1000);
const agCli = t => t.clienteId ? cliNombre(t.clienteId) : (t.clienteNombre||"Sin cliente");

const fdia = d => d.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const otNum = n => "OT-"+String(n||0).padStart(4,"0");
// número para WhatsApp: con "+" o "00" adelante se respeta el código de país (ej. +51 Perú); si no, se toma como argentino
const waNum = tel => { const raw=String(tel||"").trim(); let d=raw.replace(/\D/g,""); if(!d) return "";
  if(raw.startsWith("+")) return d; if(d.startsWith("00")) return d.slice(2);
  if(d.startsWith("549")&&d.length>=12) return d; if(d.startsWith("54")&&d.length>=11) return "549"+d.slice(2);
  d=d.replace(/^0/,""); if(d.length===12) d=d.replace(/^(\d{2,4})15/,"$1"); return "549"+d; };
const tecIds = t => Array.isArray(t.tecnicoIds)&&t.tecnicoIds.length?t.tecnicoIds:(t.tecnicoId?[t.tecnicoId]:[]);
const tecsDe = t => tecIds(t).map(id=>(S.empleados||[]).find(e=>e.id===id)).filter(Boolean);

      :`<div class="empty">${S.agenda.length?(dia?"No hay trabajos ese día.":"No hay trabajos en esta vista."):"Todavía no agendaste trabajos. Tocá «Nuevo trabajo» para cargar el primero."}</div>`}
    </div>

  $("#agNew",el).onclick=()=>modalTrabajo(dia?{fecha:dia}:null);

  el.querySelectorAll("[data-ag]").forEach(r=>r.onclick=()=>modalTrabajo(S.agenda.find(t=>t.id===r.dataset.ag)));
  bindCalendarioAg(el); bindAvisoBanner(el);
}
function calendarioAg(){
  const base=S.agMes?new Date(S.agMes+"-01T12:00:00"):new Date(); const y=base.getFullYear(), mo=base.getMonth();
  const prim=new Date(y,mo,1), dias=new Date(y,mo+1,0).getDate(), off=(prim.getDay()+6)%7, hoy=ymd(new Date());
  const cuenta={}; S.agenda.forEach(t=>{ if(t.estado==="cancelado") return; const k=t.fecha; cuenta[k]=cuenta[k]||{p:0,r:0}; cuenta[k][t.estado==="realizado"?"r":"p"]++; });
  let celdas=""; for(let i=0;i<off;i++) celdas+=`<span></span>`;
  for(let d=1;d<=dias;d++){ const k=ymd(new Date(y,mo,d)), c=cuenta[k];
    celdas+=`<button type="button" class="agC ${k===hoy?"hoy":""} ${k===S.agDia?"sel":""}" data-dia="${k}" aria-label="${d}${c?", "+(c.p+c.r)+" trabajos":""}">${d}${c?`<i>${c.p?`<b class="pp"></b>`:""}${c.r?`<b class="rr"></b>`:""}</i>`:""}</button>`; }
  return `<div class="spread" style="margin-bottom:6px"><button class="sm ghost" data-mes="-1" aria-label="Mes anterior">‹</button><b>${prim.toLocaleDateString("es-AR",{month:"long",year:"numeric"}).replace(/^./,c=>c.toUpperCase())}</b><button class="sm ghost" data-mes="1" aria-label="Mes siguiente">›</button></div>
    <div class="agCal">${["L","M","M","J","V","S","D"].map(x=>`<span class="muted">${x}</span>`).join("")}${celdas}</div>
    <div class="muted" style="font-size:12px;margin-top:8px;display:flex;gap:12px"><span><b class="pp dotl"></b> pendiente</span><span><b class="rr dotl"></b> realizado</span></div>`;
}
function bindCalendarioAg(el){
  el.querySelectorAll("[data-mes]").forEach(b=>b.onclick=()=>{ const base=S.agMes?new Date(S.agMes+"-01T12:00:00"):new Date(); const n=new Date(base.getFullYear(),base.getMonth()+Number(b.dataset.mes),1); S.agMes=ymd(n).slice(0,7); render(); });
  el.querySelectorAll("[data-dia]").forEach(b=>b.onclick=()=>{ S.agDia=S.agDia===b.dataset.dia?null:b.dataset.dia; render(); });
}

/* archivo de calendario (.ics) con alarma: el iPhone lo abre en Calendario y avisa a la hora indicada */
function icsFecha(d){ return d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""); }
function icsTxt(s){ return String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/[,;]/g,m=>"\\"+m); }
function textoAg(t){ return [t.descripcion, t.telefono?"Tel: "+t.telefono:"", t.tecnico?"Técnico: "+t.tecnico:"", Number(t.precio)>0?"A cobrar: "+money(t.precio):""].filter(Boolean).join("\n"); }
function bajarIcs(ts,nombre){
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//JAI Seguridad//Agenda//ES","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  ts.forEach(t=>{ const ini=agInicio(t); if(!ini) return; const fin=new Date(ini.getTime()+(Number(t.duracion)||60)*60000);
    L.push("BEGIN:VEVENT","UID:"+(t.id||Math.random().toString(36).slice(2))+"@jaiseguridad","DTSTAMP:"+icsFecha(new Date()),"DTSTART:"+icsFecha(ini),"DTEND:"+icsFecha(fin),
      "SUMMARY:"+icsTxt((t.tipo||"Service")+" · "+agCli(t)),"DESCRIPTION:"+icsTxt(textoAg(t)), ...(t.direccion?["LOCATION:"+icsTxt(t.direccion)]:[]),
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsTxt((t.tipo||"Service")+" · "+agCli(t)),"TRIGGER:-PT"+(Number(t.aviso)||0)+"M","END:VALARM","END:VEVENT"); });
  L.push("END:VCALENDAR");
  const blob=new Blob([L.join("\r\n")],{type:"text/calendar"});
  (async()=>{ try{ const dl=await window.claude?.use("downloads"); if(dl){ await dl.save({filename:nombre,data:blob}); return; } }catch(e){ if(e&&e.code==="declined") return; console.error(e); }
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nombre; document.body.appendChild(a); a.click(); a.remove(); })();
}
function linkGcal(t){ const ini=agInicio(t)||new Date(), fin=new Date(ini.getTime()+(Number(t.duracion)||60)*60000);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent((t.tipo||"Service")+" · "+agCli(t))+"&dates="+icsFecha(ini)+"/"+icsFecha(fin)+"&details="+encodeURIComponent(textoAg(t))+(t.direccion?"&location="+encodeURIComponent(t.direccion):""); }

/* lado del dueño: mantiene las órdenes al día y trae los reportes a la agenda */
let syncT=null;
function programarSync(){ if(!S.esDueno||!S.db) return; clearTimeout(syncT); syncT=setTimeout(sincronizarTec,1500); }
async function sincronizarTec(){
  if(!S.esDueno||!S.db||!S.agendaOk||!S.ordenesOk) return;
  const ords=new Map((S.ordenes||[]).map(o=>[o.id,o]));
  for(const t of S.agenda){
    const quiere=tecIds(t).length&&t.estado!=="cancelado";
    if(quiere){ const o=ordenDe(t), cur=ords.get(t.id); const {id,...curData}=cur||{};
      if(!cur||JSON.stringify(Object.keys(o).map(k=>curData[k]))!==JSON.stringify(Object.keys(o).map(k=>o[k]))) await write(()=>S.db.doc("ordenes/"+t.id).set(o)); }
    else if(ords.has(t.id)) await write(()=>S.db.doc("ordenes/"+t.id).delete());
    ords.delete(t.id);
  }
  for(const id of ords.keys()) await write(()=>S.db.doc("ordenes/"+id).delete());
  // reportes de los instaladores → agenda
  for(const t of S.agenda){
    const reps=repsDe(t.id); const vistos=t.tecSyncs||{}; const nuevosR=reps.filter(r=>r.ts&&String(vistos[r.parteId]||"")!==String(r.ts)&&!(reps.length===1&&String(t.tecSync||"")===String(r.ts)));
    if(!nuevosR.length) continue;
    const last=reps[0]; const syncs={...vistos}; reps.forEach(r=>syncs[r.parteId]=r.ts);
    const upd={tecSyncs:syncs,tecSync:last.ts,estadoTec:last.estado||"",estadoTecTs:last.ts,notaTec:last.nota||"",tecQuien:last.quien||""};
    const base=(t.gastos||[]).filter(g=>!(g.elec&&nuevosR.some(r=>(r.quien||"Instalador")===g.porTecnico&&!(r.gastos||[]).some(x=>x.id===g.id))));
    const ids=new Set(base.map(g=>g.id)); const nuevos=[]; nuevosR.forEach(r=>(r.gastos||[]).forEach(g=>{ if(g&&g.id&&!ids.has(g.id)){ ids.add(g.id); nuevos.push({...g,porTecnico:r.quien||"Instalador"}); } }));
    if(nuevos.length||base.length!==(t.gastos||[]).length) upd.gastos=[...base,...nuevos];
    const cobr=nuevosR.filter(r=>Number(r.cobrado)>0);
    if(cobr.length&&!(Number(t.cobrado)>0)){ upd.cobrado=Math.round(cobr.reduce((a,r)=>a+Number(r.cobrado),0)); upd.medio=cobr[0].medio||t.medio||""; }
    if(nuevosR.some(r=>r.estado==="realizado")&&agAbierto(t)) upd.estado="realizado";
    else if(nuevosR.some(r=>r.estado==="en_sitio")&&t.estado==="pendiente") upd.estado="en_proceso";
    const ok=await write(()=>S.db.doc("agenda/"+t.id).update(upd));
    if(ok&&(upd.estado||upd.cobrado)) await write(()=>sincCuentaAg(t.id,{...t,...upd}));
  }
}

async function initTecnico(db,user){
  S.modoTec=true; document.body.classList.add("modoTec");
  try{ S.miId=user&&user.id?await user.id():null; }catch(e){ S.miId=null; }
  // Lector / Comentarista (o invitado sin identificación): no puede guardar en el panel → modo solo lectura
  let puede=null; try{ puede=user&&user.can?await user.can("data.write"):null; }catch(e){}
  const cargarLocal=()=>{ S.soloLect=true; let loc=null; try{ loc=JSON.parse(localGet("jaiTec_"+(S.miId||"local"))||"null"); }catch(_){} S.miParte=loc||{trabajos:{}}; S.parteOk=true; };
  if(puede===false||!S.miId) cargarLocal();
  db.collection("ordenes").onSnapshot(s=>{ S.ordenes=s.docs.map(d=>({id:d.id,...d.data()})); S.ordenesOk=true; renderTec(); }, e=>{ console.error(e); $("#tecRoot").innerHTML=`<div class="panel"><h2>Sin acceso</h2><p class="muted">Tu usuario no tiene permiso para ver las órdenes de trabajo. Pedile a JAI Seguridad que te invite desde «Acceso para instaladores».</p></div>`; });
  if(!S.soloLect) db.doc("partes/"+S.miId).onSnapshot(s=>{ if(S.soloLect) return;
    if(!s.exists){ let loc=null; try{ loc=JSON.parse(localGet("jaiTec_"+S.miId)||"null"); }catch(_){} if(loc&&loc.tecnicoId){ cargarLocal(); renderTec(); return; } }
    S.miParte=s.exists?s.data():null; S.parteOk=true; renderTec(); }, e=>{
    // sin permiso para leer su parte: se recuerda el nombre en este celular y se avisa por WhatsApp
    console.error(e); cargarLocal(); renderTec(); });
  renderTec();
}
async function guardarParte(fn,msg){
  const p=JSON.parse(JSON.stringify(S.miParte||{trabajos:{}})); p.trabajos=p.trabajos||{};
  fn(p); p.actualizado=new Date().toISOString();
  if(!S.soloLect){
    try{ await S.db.doc("partes/"+S.miId).set(p); S.miParte=p; if(msg) toast(msg); renderTec(); return true; }
    catch(e){ console.error(e); S.soloLect=true; }   // el panel no deja guardar con este permiso: sigue en modo solo lectura
  }
  localSet("jaiTec_"+(S.miId||"local"),JSON.stringify(p)); S.miParte=p; if(msg) toast(msg); renderTec(); return true;

          b.disabled=false; b.textContent="Guardar"; }
        const det=$("#otElecD",m).value.trim(); const mismo=elecR0&&elecR0.importe===imp&&elecR0.comprobante===comp;
        gs=gs.concat([{id:(mismo&&elecR0.id)||("el"+id.slice(0,6)+Date.now().toString(36)),fecha:new Date().toISOString(),cat:"Materiales",detalle:"Materiales eléctricos"+(det?": "+det:""),importe:imp,elec:true,comprobante:comp}]); }
      // firma del cliente: se pide al marcar Terminado
      let firma=r0.firma||"", firmaNombre=r0.firmaNombre||"", firmaTs=r0.firmaTs||"";
      const firmoAhora=!pad.vacia();
      if(firmoAhora){ const nom=$("#otFirmaN",m).value.trim(); if(!nom){ toast("Falta la aclaración: el nombre de quien firmó."); $("#otFirmaN",m).focus(); return; }
        const b=$("#otOk",m); b.disabled=true; b.textContent="Guardando firma…";
        try{ firma=await subirFirma(await pad.blob(),id); firmaNombre=nom; firmaTs=new Date().toISOString(); }
        catch(err){ console.error(err); b.disabled=false; b.textContent="Guardar"; toast("No se pudo guardar la firma: "+(err.message||err)+". Revisá la señal y probá de nuevo."); return; }
        b.disabled=false; b.textContent="Guardar"; }
      else if(est==="realizado"&&!firma&&!window.confirm("El cliente todavía no firmó la conformidad. ¿Guardar igual sin firma?")){ $("#otFirmaP",m).scrollIntoView({behavior:"smooth",block:"center"}); return; }
      const ok=await guardarParte(p=>{ p.trabajos[id]={comentarios:((p.trabajos[id]||{}).comentarios||[]),estado:est,ts:new Date().toISOString(),nota,gastos:gs,materiales,cobrado:cob,medio:$("#otMed",m).value,...(firma?{firma,firmaNombre,firmaTs}:{})}; },"Guardado");
      if(ok) closeModal();
    };
  },620);
}

function modal(html,bind,ancho){ const root=$("#modalRoot"); root.innerHTML=`<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" ${ancho?`style="width:min(${ancho}px,100%)"`:""}>${html}</div></div>`; const m=root.querySelector(".modal"); root.querySelector(".modal-bg").onclick=e=>{ if(e.target.classList.contains("modal-bg")) closeModal(); }; m.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal); bind&&bind(m); }
function closeModal(){ $("#modalRoot").innerHTML=""; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });
function confirmar(msg,fn){ modal(`<p style="margin:0">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button data-close>Cancelar</button><button class="pri" id="cfOk">Confirmar</button></div>`,m=>{ $("#cfOk",m).onclick=()=>{ closeModal(); fn(); }; }); }
function modalTexto(t,txt){ modal(`<h2>${esc(t)}</h2><textarea rows="12" readonly>${esc(txt)}</textarea><div class="row" style="justify-content:flex-end"><button data-close>Cerrar</button></div>`,m=>{ const ta=m.querySelector("textarea"); ta.focus(); ta.select(); }); }

render();
initDb();
</script>
