<meta name="apple-mobile-web-app-title" content="Portero">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#123039">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night:#123039;      /* pared / fondo */
    --night2:#0c242b;
    --alu:#e4e8e8;        /* placa de aluminio */
    --alu2:#c3cacc;
    --engrave:#33454c;    /* texto grabado */
    --muted:#5f6f75;
    --brass:#d0a24a;      /* aro del pulsador */
    --brass2:#8a6420;
    --glass:#1d2a2f;      /* cara del pulsador */
    --ok:#1f7a4a; --err:#a8321f; --amber:#f2b03d;
    --font: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --cond: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; min-height:100vh; font:400 1rem/1.45 var(--font); color:var(--engrave);
         background:
           radial-gradient(120% 70% at 50% 0%, #1b4450 0%, transparent 60%),
           repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 2px, transparent 2px 7px),
           var(--night);
         display:flex; justify-content:center; padding:22px 16px 40px; }
  .wrap, .card { width:100%; max-width:430px; }

  /* ---------- Placa del portero ---------- */
  .plate { position:relative; border-radius:30px; padding:26px 22px 24px; text-align:center;
           background:
             repeating-linear-gradient(90deg, rgba(255,255,255,.22) 0 1px, rgba(0,0,0,.025) 1px 3px),
             linear-gradient(180deg, var(--alu) 0%, var(--alu2) 100%);
           box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 0 rgba(0,0,0,.12),
                       0 1px 0 rgba(255,255,255,.08), 0 24px 50px -18px rgba(0,0,0,.65); }
  /* tornillos */
  .plate::before, .plate::after { content:""; position:absolute; top:14px; width:11px; height:11px; border-radius:50%;
           background: radial-gradient(circle at 35% 35%, #fff 0 18%, #aab3b6 40%, #6f7a7e 100%);
           box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  .plate::before { left:14px; } .plate::after { right:14px; }
  .plate + .plate, .plate + .box, .box + .box { margin-top:14px; }

  .plate-top { display:flex; align-items:center; justify-content:center; gap:14px; margin:0 0 18px; }
  .grille { width:92px; height:22px; border-radius:11px;
            background: repeating-linear-gradient(90deg, #4c5a5f 0 3px, transparent 3px 8px);
            -webkit-mask: linear-gradient(#000,#000); opacity:.75;
            box-shadow: inset 0 1px 2px rgba(0,0,0,.35); }
  .led { width:9px; height:9px; border-radius:50%; background:#5d6b70; box-shadow: inset 0 1px 1px rgba(0,0,0,.4); }
  .plate:has(.bell:disabled) .led { background:var(--amber); box-shadow:0 0 10px var(--amber); animation: blink 1.2s steps(2,end) infinite; }
  .plate.live .led, .plate:has(.status.ok) .led { background:#3fd17a; box-shadow:0 0 10px #3fd17a; animation:none; }
  @keyframes blink { 50% { opacity:.35; } }

  .nameplate { display:inline-block; min-width:72%; max-width:100%; padding:12px 18px 14px; margin:0 auto 6px; border-radius:12px;
               background: linear-gradient(180deg, #d5dadb, #eef1f1);
               box-shadow: inset 0 2px 3px rgba(0,0,0,.18), inset 0 -1px 0 rgba(255,255,255,.8); }
  .nameplate small { display:block; font:500 .82rem/1.2 var(--font); color:var(--muted); letter-spacing:.02em; }
  .nameplate strong, h1 { font:700 clamp(1.7rem, 7.5vw, 2.2rem)/1.02 var(--cond); letter-spacing:.01em; color:var(--engrave);
               text-shadow: 0 1px 0 rgba(255,255,255,.85); margin:0; overflow-wrap:anywhere; }
  .nameplate strong { display:block; margin-top:2px; }
  .sub { font:500 .9rem/1.3 var(--font); color:var(--muted); margin:4px 0 0; }

  /* ---------- Pulsador ---------- */
  .bell { --s:min(212px, 62vw); width:var(--s); height:var(--s); margin:22px auto 8px; padding:12px; border:none; border-radius:50%;
          cursor:pointer; display:block; position:relative; -webkit-tap-highlight-color:transparent;
          background: conic-gradient(from 210deg, #f4dc9c, var(--brass) 18%, var(--brass2) 42%, #e9c879 62%, var(--brass2) 82%, #f4dc9c);
          box-shadow: 0 2px 0 rgba(255,255,255,.7), 0 14px 26px -10px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.25); }
  .bell-face { width:100%; height:100%; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
               background: radial-gradient(circle at 50% 30%, #34474e 0%, var(--glass) 62%);
               box-shadow: inset 0 6px 14px rgba(255,255,255,.08), inset 0 -10px 18px rgba(0,0,0,.5);
               color:#f6e3b4; transition: transform .12s ease, background .2s; }
  .bell svg { width:30%; height:auto; filter: drop-shadow(0 0 10px rgba(242,176,61,.45)); }
  .bell #bellTxt { font:600 1.18rem/1 var(--cond); letter-spacing:.04em; }
  .bell:active .bell-face { transform: scale(.965); }
  .bell:disabled { cursor:default; }
  .bell:disabled .bell-face { color:#c9d1d3; background: radial-gradient(circle at 50% 30%, #4a5a60 0%, #2b383d 70%); }
  .bell:disabled svg { filter:none; opacity:.8; }
  /* ondas mientras llama */
  .bell::after { content:""; position:absolute; inset:-2px; border-radius:50%; border:2px solid var(--amber); opacity:0; pointer-events:none; }
  .bell.calling::after, .plate:has(#vzone:not(.hide)) .bell::after { animation: ripple 1.6s ease-out infinite; }
  @keyframes ripple { 0% { transform:scale(1); opacity:.8; } 100% { transform:scale(1.28); opacity:0; } }

  /* ---------- Textos y estado ---------- */
  p { margin:0 0 14px; color:var(--muted); }
  .status { min-height:1.45em; margin:8px 2px 0; font:600 1rem/1.35 var(--font); color:var(--engrave); }
  .status.ok { color:var(--ok); } .status.err { color:var(--err); }
  .foot { text-align:center; color:#9fb6bd; font-size:.86rem; margin:16px 8px 0; }
  .foot a { color:#d9e6e9; }

  /* ---------- Campos (rebajados en la placa) ---------- */
  input, textarea { width:100%; padding:12px 14px; margin:0 0 10px; font:400 1rem var(--font); color:var(--engrave);
          border:1px solid rgba(0,0,0,.14); border-radius:12px; background:#f5f7f7;
          box-shadow: inset 0 2px 3px rgba(0,0,0,.08); }
  textarea { resize:none; height:66px; }
  input:focus, textarea:focus { outline:none; border-color:var(--brass2); box-shadow:0 0 0 3px rgba(208,162,74,.35); }
  .extra { text-align:left; margin:14px 0 0; border-top:1px solid rgba(0,0,0,.1); padding-top:12px; }
  .extra summary { cursor:pointer; list-style:none; font:600 .95rem var(--font); color:var(--engrave); text-align:center; padding:4px; }
  .extra summary::-webkit-details-marker { display:none; }
  .extra summary::after { content:" +"; color:var(--brass2); }
  .extra[open] summary::after { content:" –"; }
  .extra[open] summary { margin-bottom:10px; }

  /* ---------- Botones ---------- */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:11px 18px; margin:4px; border-radius:999px; border:none;

  .keypad { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; max-width:300px; margin:0 auto; }

  .key:active { transform: scale(.95); }

  .door #pinBox { max-width:260px; margin:12px auto 0; }

  .check input { width:auto; margin:0; }

  /* ---------- Modo kiosco (tablet en la entrada) ---------- */

  @media (prefers-reduced-motion: reduce) {

  .screen:has(> video.hide) { display:none; }

</head>
<body>
<main class="wrap" id="app"></main>

<script>
// ==== CONFIGURACIÓN ====
const NTFY = "https://ntfy.sh";
// Apertura de puerta: Edge Function "puerta" en Supabase (la clave es la pública "publishable")
const SUPA_URL = "https://vrgkfaueuszwmocdnylw.supabase.co";
const SUPA_KEY = "sb_publishable_F134Y7czJn-F5r1BWR3oRQ_arEXKV2M";
async function puertaApi(body) {
  let r;
  try {
    r = await fetch(`${SUPA_URL}/functions/v1/puerta`, { method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPA_KEY }, body: JSON.stringify(body) });
  } catch { throw new Error("Sin conexión. Probá de nuevo."); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || "Error " + r.status); e.status = r.status; throw e; }
  return j;
}
const COOLDOWN_SEG = 30;
const ESPERA_VIDEO_SEG = 120;

const params = new URLSearchParams(location.search);
const _e = params.get("e") || "";
const KIOSCO = params.has("kiosco");
const KTOKEN = params.get("k") || "";
const CARAS = KIOSCO && KTOKEN.length >= 32;   // cara + PIN solo en la tablet autorizada
const ARCHIVO = /^[a-z0-9._-]+\.json$/i.test(_e) && _e !== "edificios.json" ? _e : "edificio.json";   // cada edificio es un archivo .json del repo
const app = document.getElementById("app");
const $ = id => document.getElementById(id);
const BASE = location.href.split("?")[0];
const BELL_SVG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>`;


// =====================================================================
//  VISITANTE: elige departamento y toca el timbre (con videollamada)
// =====================================================================
async function portero() {
  app.innerHTML = `<section class="plate"><div class="plate-top"><span class="led" aria-hidden="true"></span><span class="grille" aria-hidden="true"></span></div><p class="status">Cargando…</p></section>`;
  let ed;
  try {
    const r = await fetch(ARCHIVO + "?v=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw r.status;
    ed = await r.json();
  } catch (err) {
    if (KIOSCO && err !== 404) {   // sin internet: reintenta solo
      app.innerHTML = `<section class="plate"><div class="plate-top"><span class="led" aria-hidden="true"></span><span class="grille" aria-hidden="true"></span></div>
        <div class="nameplate"><strong>Sin conexión</strong></div>
        <p style="margin-top:12px">El portero se está reconectando. Probá de nuevo en un momento.</p></section>`;
      setTimeout(portero, 30000);
      return;
    }
    app.innerHTML = `<section class="plate"><div class="plate-top"><span class="led" aria-hidden="true"></span><span class="grille" aria-hidden="true"></span></div>
      <div class="nameplate"><strong>Portero sin configurar</strong></div>
      <p style="margin-top:12px">Todavía no hay departamentos cargados.</p>
      ${KIOSCO ? "" : `<a class="btn" href="${BASE}?admin">Configurar portero</a>`}</section>`;
    return;
  }
  document.title = ed.nombre || "Portero";
  const unidades = (ed.unidades || []).filter(u => u.topic);

  const lista = (filtro = "") => {
    const f = filtro.toLowerCase();
    return unidades.map((u, i) => ({ u, i }))
      .filter(({ u }) => !f || (u.unidad + " " + (u.nombre || "")).toLowerCase().includes(f))
      .map(({ u, i }) => `<button class="unit" data-i="${i}" aria-label="Tocar timbre de ${esc(u.unidad)}"><b>${esc(u.unidad)}</b><span>${esc(u.nombre || "")}</span><i aria-hidden="true"></i></button>`)
      .join("") || `<p class="empty">Ningún departamento coincide con la búsqueda.</p>`;
  };

  app.innerHTML = `
    <section class="plate">
      <div class="plate-top"><span class="led" aria-hidden="true"></span><span class="grille" aria-hidden="true"></span></div>
      <div class="nameplate">${ed.direccion ? `<small>${esc(ed.direccion)}</small>` : ""}<strong>${esc(ed.nombre || "Portero")}</strong></div>
      <p class="sub" style="margin:12px 0 0">Tocá el botón del departamento al que venís.</p>
      ${unidades.length > 8 ? `<input id="buscar" type="search" placeholder="Buscar por departamento o apellido" style="margin:14px 0 0">` : ""}
      <div class="directory" id="grid">${lista()}</div>
      ${CARAS ? `
      <div class="facebar">
        <video id="fvid" autoplay playsinline muted class="espejo"></video>
        <div><b>¿Vivís acá?</b><span id="fst">Acercate a la cámara para entrar con tu cara y tu PIN.</span></div>
        <button type="button" class="btn sm ghost" id="regCara">Registrar mi cara</button>
      </div>` : ""}
    </section>
    <p class="foot">${CARAS ? "Esta tablet usa reconocimiento facial solo para propietarios registrados. " : ""}Se abre una videollamada con el departamento. Si no das permiso de cámara, el aviso llega igual.</p>`;

  const bind = () => app.querySelectorAll("#grid .unit").forEach(b => b.onclick = () => timbreUnidad(ed, unidades[+b.dataset.i]));
  bind();
  if (CARAS) {
    const TXT = { listo: "Acercate a la cámara para entrar con tu cara y tu PIN.", lejos: "Acercate un poco más a la tablet.",
                  buscando: "Reconociendo…", desconocido: "No te reconocemos. Si vivís acá, registrá tu cara.", error: "Reconocimiento facial no disponible." };
    Caras.vigilar($("fvid"), e => { if ($("fst")) $("fst").textContent = TXT[e] || ""; }, unidad => holaPropietario(ed, unidad));
    $("regCara").onclick = () => registrarCara(ed);
  }
  if ($("buscar")) $("buscar").oninput = e => { $("grid").innerHTML = lista(e.target.value); bind(); };
}

function timbreUnidad(ed, u) {
  if (CARAS) Caras.parar();
  app.innerHTML = `
    <button class="back" id="volver" style="color:#d9e6e9">← Todos los departamentos</button>
    <section class="plate">
      <div class="plate-top"><span class="led" aria-hidden="true"></span><span class="grille" aria-hidden="true"></span></div>
      <div class="nameplate"><small>${esc(ed.nombre || "")}</small><strong>${esc(u.unidad)}</strong></div>
      ${u.nombre ? `<p class="sub">${esc(u.nombre)}</p>` : ""}
      <div id="vzone" class="screen hide">
        <video id="yo" autoplay playsinline muted></video>
        <audio id="ellos" autoplay playsinline></audio>
        <div class="row-actions">
          <button class="btn hide" id="oir">🔊 Activar sonido</button>
          <button class="btn red" id="cortar">Cortar</button>
        </div>
      </div>
      <button class="bell" id="bell" aria-label="Tocar timbre de ${esc(u.unidad)}"><span class="bell-face">${BELL_SVG}<span id="bellTxt">Tocar timbre</span></span></button>
      <div class="status" id="st" role="status" aria-live="polite"></div>
      <details class="extra">
        <summary>Dejar mi nombre o un mensaje</summary>
        <input id="nombre" placeholder="Tu nombre" maxlength="40" autocomplete="name">
        <input id="telvis" type="tel" inputmode="tel" placeholder="Tu teléfono, para que te llamen" maxlength="20" autocomplete="tel">
        <textarea id="msg" placeholder="Mensaje: delivery, visita, etc." maxlength="140"></textarea>
      </details>
    </section>`;
  let enCurso = false;
  $("volver").onclick = () => { if (!enCurso || confirmar()) portero(); };
  $("bell").onclick = () => {
    enCurso = true; Kiosco.cancelar();
    tocarTimbre(ed, u, () => { enCurso = false; Kiosco.volverEn(15, () => !enCurso); });
  };
  // En la tablet: si nadie toca nada, vuelve a la lista
  Kiosco.volverEn(60, () => !enCurso);
}
function confirmar() { $("cortar") && $("cortar").click(); return true; }

async function tocarTimbre(ed, u, alTerminar, desde) {   // desde = departamento que llama (llamada interna)
  const bell = $("bell"), st = $("st");
  const estado = (t, c) => { st.className = "status " + (c || ""); st.textContent = t; };
  const nombre = $("nombre").value.trim(), msg = $("msg").value.trim();
  const telVis = $("telvis").value.replace(/[^\d+]/g, "");
  let cuerpo = desde
    ? `${desde.unidad}${desde.nombre ? " (" + desde.nombre + ")" : ""} llama a ${u.unidad}`
    : (nombre ? nombre : "Alguien") + " toca el timbre de " + u.unidad;
  if (msg) cuerpo += "\n💬 " + msg;
  if (telVis) cuerpo += "\n📞 " + telVis;

  const avisar = async (link) => {
    const acc = [];
    if (link) acc.push(`view, Atender video, ${link}`);
    if (telVis) acc.push(`view, Llamar, tel:${telVis}`, `view, WhatsApp, https://wa.me/${telVis.replace("+", "")}`);
    const q = new URLSearchParams({
      title: desde ? `Llamada interna de ${desde.unidad} - ${ed.nombre || "Edificio"}` : `Timbre ${u.unidad} - ${ed.nombre || "Edificio"}`,
      priority: link ? "urgent" : "high", tags: link ? "bell,video_camera" : "bell"
    });
    if (acc.length) q.set("actions", acc.slice(0, 3).join("; "));
    if (link) q.set("click", link);
    const r = await fetch(`${NTFY}/${encodeURIComponent(u.topic)}?${q}`, {
      method: "POST", body: cuerpo + (link ? "\n📹 Esperando en videollamada" : "")
    });
    if (!r.ok) throw new Error(r.status);
  };
  const soloTimbre = async (sinVideo) => {
    estado("Avisando…");
    try { await avisar(null); estado("¡Listo! Ya avisamos" + (sinVideo ? " (sin video)" : "") + ". Esperá un momento 🙂", "ok"); }
    catch { estado("No se pudo avisar. Revisá tu conexión e intentá de nuevo.", "err"); bell.disabled = false; alTerminar(); return; }
    cuentaRegresiva(bell); alTerminar();
  };

  bell.disabled = true;
  estado("Activando cámara y micrófono…");
  let stream, peer, timeout, avisado = false, cerrado = false;
  const terminar = (t, c) => {
    if (cerrado) return; cerrado = true;
    clearTimeout(timeout);
    try { peer && peer.destroy(); } catch {}
    try { stream && stream.getTracks().forEach(x => x.stop()); } catch {}
    $("yo").srcObject = null; $("vzone").classList.add("hide");
    estado(t || "Llamada terminada.", c);
    cuentaRegresiva(bell); alTerminar();
  };

  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true }); }
  catch { return soloTimbre(true); }
  if (typeof Peer === "undefined") { stream.getTracks().forEach(x => x.stop()); return soloTimbre(true); }

  $("vzone").classList.remove("hide"); $("yo").srcObject = stream;
  $("cortar").onclick = () => terminar("Cortaste la llamada.");
  estado("Conectando…");
  peer = new Peer("portero-" + crypto.getRandomValues(new Uint32Array(3)).join(""));

  peer.on("open", async (id) => {
    const link = `${BASE}?atender=${encodeURIComponent(id)}&n=${encodeURIComponent(u.unidad + " · " + (ed.nombre || ""))}&e=${encodeURIComponent(ARCHIVO)}&u=${encodeURIComponent(u.unidad)}`;
    try { await avisar(link); avisado = true; }
    catch { return terminar("No se pudo avisar. Revisá tu conexión e intentá de nuevo.", "err"); }
    estado(`🔔 Llamando a ${u.unidad}… esperá que te atiendan.`, "ok");
    timeout = setTimeout(() => terminar("No atendieron la videollamada, pero el aviso ya llegó."), ESPERA_VIDEO_SEG * 1000);
  });

  // Quien atiende se conecta; el visitante lo llama con video + audio.
  peer.on("connection", (conn) => {
    clearTimeout(timeout);
    estado("Conectando video…");
    const iniciar = () => {
      const call = peer.call(conn.peer, stream);
      call.on("stream", (remoto) => {
        estado("¡Conectado! Ya te están viendo y escuchando.", "ok");
        const a = $("ellos"); a.srcObject = remoto;
        a.play().catch(() => { $("oir").classList.remove("hide"); $("oir").onclick = () => { a.play(); $("oir").classList.add("hide"); }; });
      });
      call.on("close", () => terminar("La llamada terminó. ¡Gracias!"));
    };
    if (conn.open) iniciar(); else conn.on("open", iniciar);
    conn.on("close", () => terminar("La llamada terminó. ¡Gracias!"));
  });

  peer.on("error", () => {
    if (avisado) return terminar("Se cortó la videollamada, pero el aviso ya llegó.");
    cerrado = true; clearTimeout(timeout);
    try { peer.destroy(); } catch {}
    stream.getTracks().forEach(x => x.stop());
    $("vzone").classList.add("hide");
    soloTimbre(true);
  });
}

function cuentaRegresiva(bell) {
  let s = COOLDOWN_SEG;
  const txt = $("bellTxt");
  const t = setInterval(() => {
    if (!document.body.contains(bell)) return clearInterval(t);
    txt.textContent = `Esperá ${s--}s`;
    if (s < 0) { clearInterval(t); txt.textContent = "Tocar timbre"; bell.disabled = false; }
  }, 1000);
}

// =====================================================================
//  VECINO: atiende desde la notificación
// =====================================================================
// =====================================================================
//  VECINO: portero interno en su celular → llamar a portería
//  edificio.html?vecino=1&e=<archivo>&u=<departamento>
// =====================================================================
const esPorteria = u => /porter|encargad|conserj|guardia|seguridad/i.test(u.unidad + " " + (u.nombre || ""));

async function vecinoPantalla() {
  const unidad = params.get("u") || "";
  app.innerHTML = `<section class="plate">${PLACA_TOP}<p class="status">Cargando…</p></section>`;
  let ed;
  try { const r = await fetch(ARCHIVO + "?v=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw 0; ed = await r.json(); }
  catch { app.innerHTML = `<section class="plate">${PLACA_TOP}<div class="nameplate"><strong>Sin conexión</strong></div><p style="margin-top:12px">Revisá internet y volvé a abrir esta página.</p></section>`; return; }
  const unidades = (ed.unidades || []).filter(x => x.topic);
  const yo = unidades.find(x => x.unidad === unidad);
  const port = unidades.find(esPorteria);
  document.title = "Portero interno";

  if (!yo) {
    app.innerHTML = `<section class="plate">${PLACA_TOP}<div class="nameplate"><strong>Link no válido</strong></div>
      <p style="margin-top:12px">Este departamento ya no figura en ${esc(ed.nombre || "el edificio")}. Pedile el link nuevo a la administración.</p></section>`;
    return;

// ---------- Abrir puerta desde "Atender" ----------
function puertaAtender(edificio, unidad) {
  const KEY = `pin:${edificio}:${unidad}`;
  const guardado = () => { try { return localStorage.getItem(KEY) || ""; } catch { return ""; } };
  const est = (t, c) => { $("dst").className = "status " + (c || ""); $("dst").textContent = t; };
  if (!guardado()) $("pinBox").classList.remove("hide");
  $("abrir").onclick = async () => {
    const pin = guardado() || $("pin").value.trim();
    if (!/^\d{4,8}$/.test(pin)) { $("pinBox").classList.remove("hide"); $("pin").focus(); return est("Escribí tu PIN (de 4 a 8 números).", "err"); }
    $("abrir").disabled = true; est("Abriendo…");
    try {
      await puertaApi({ accion: "abrir", edificio, unidad, pin });
      if ($("recordar").checked) { try { localStorage.setItem(KEY, pin); } catch {} }
      $("pinBox").classList.add("hide"); $("pin").value = "";
      est("🔓 Puerta abierta", "ok");
      setTimeout(() => { $("abrir").disabled = false; }, 4000);
    } catch (e) {
      $("abrir").disabled = false;
      if (e.status === 401) { try { localStorage.removeItem(KEY); } catch {} $("pinBox").classList.remove("hide"); $("pin").value = ""; }
      est(e.message, "err");
    }
  };
}

function atender() {
  const id = params.get("atender"), n = params.get("n") || "Portero";
  app.innerHTML = `
    <section class="plate">
      <div class="plate-top"><span class="led" aria-hidden="true"></span><span class="grille" aria-hidden="true"></span></div>
      <div class="nameplate"><small>Timbre</small><strong>${esc(n)}</strong></div>
      <div class="screen"><video id="ellos" autoplay playsinline class="hide"></video></div>
      <p class="status" id="ast" role="status" aria-live="polite">Hay alguien en la puerta.</p>
      <button class="btn answer" id="abtn">Atender</button>
      <div id="ctrl" class="row-actions hide">
        <button class="btn" id="mute">🎙️ Silenciar a la visita</button>
        <button class="btn red" id="colgar">Colgar</button>
      </div>
      ${params.get("u") ? `
      <div class="door">
        <button class="btn door-btn" id="abrir">🔓 Abrir puerta</button>
        <div id="pinBox" class="hide">
          <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="Tu PIN de apertura" autocomplete="off">
          <label class="check"><input type="checkbox" id="recordar" checked> Recordar en este celular</label>
        </div>
        <div class="status" id="dst" role="status" aria-live="polite"></div>
        <div id="portBox" class="hide" style="margin-top:14px">
          <button class="btn" id="llamarPort">📞 Llamar a portería</button>
          <div class="status" id="pst" role="status" aria-live="polite"></div>
          <audio id="portAudio" autoplay playsinline></audio>
        </div>
      </div>` : ""}
    </section>`;
  if (/^Llamada de /.test(n)) $("ast").textContent = "Te están llamando.";
  let peer, stream, call, visitaActiva = false, pActiva = false;
  // El micrófono se comparte entre la visita y la llamada a portería: se apaga cuando no queda ninguna
  let pStream = null;   // copia del micrófono solo para la llamada a portería (se silencia aparte)
  const micLibre = () => { if (!visitaActiva && !pActiva) { try { stream && stream.getTracks().forEach(x => x.stop()); } catch {} stream = null; } };
  const fin = (t) => {
    visitaActiva = false;
    try { call && call.close(); } catch {}
    try { peer && peer.destroy(); } catch {}
    micLibre();
    $("ast").textContent = t || "Llamada terminada.";
    $("ctrl").classList.add("hide"); $("ellos").classList.add("hide");
  };
  $("abtn").onclick = async () => {
    $("abtn").classList.add("hide");
    $("ast").textContent = "Conectando…";
    try { if (!stream) stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { return fin("Necesitás dar permiso de micrófono para hablar."); }
    if (typeof Peer === "undefined") return fin("No se pudo cargar la videollamada.");
    visitaActiva = true;
    peer = new Peer();
    peer.on("open", () => {
      const conn = peer.connect(id);
      conn.on("close", () => fin("El visitante cortó."));
    });
    peer.on("call", (c) => {
      call = c; call.answer(stream);
      call.on("stream", (remoto) => {
        const v = $("ellos"); v.srcObject = remoto; v.classList.remove("hide"); v.play().catch(() => {});
        $("ast").textContent = remoto.getVideoTracks().length
          ? "Conectado. El visitante te escucha, pero no te ve."
          : "Conectado solo con audio.";
        $("ctrl").classList.remove("hide");
      });
      call.on("close", () => fin("El visitante cortó."));
    });
    peer.on("error", (e) => fin(e && e.type === "peer-unavailable"
      ? "El visitante ya cortó o se fue." : "No se pudo conectar. Probá de nuevo."));
  };
  $("colgar").onclick = () => fin("Colgaste la llamada.");
  if ($("abrir")) puertaAtender(params.get("e") || "edificio.json", params.get("u"));
  // Micrófono hacia la visita (independiente del de portería)
  let silencioAuto = false;   // true si se silenció solo al conectar con portería
  const micVisita = (activo) => {
    if (!stream) return;
    stream.getAudioTracks().forEach(t => t.enabled = activo);
    $("mute").textContent = activo ? "🎙️ Silenciar a la visita" : "🔇 La visita no te escucha";
    $("mute").classList.toggle("red", !activo);
  };
  $("mute").onclick = () => {
    if (!stream) return;
    silencioAuto = false;
    micVisita(!stream.getAudioTracks()[0].enabled);
  };

  // ---- Llamar a portería sin salir de esta pantalla (solo audio, se puede en medio de la visita) ----
  let pPeer = null, pTimeout = null, port = null;
  const pEst = (t, c) => { $("pst").className = "status " + (c || ""); $("pst").textContent = t; };
  const cortarPort = (t) => {
    clearTimeout(pTimeout); pActiva = false;
    try { pPeer && pPeer.destroy(); } catch {}
    pPeer = null; $("portAudio").srcObject = null;
    try { pStream && pStream.getTracks().forEach(x => x.stop()); } catch {}
    pStream = null;
    if (silencioAuto) { silencioAuto = false; micVisita(true); }   // vuelve a escucharte la visita
    $("llamarPort").textContent = `📞 Llamar a ${port.unidad}`; $("llamarPort").classList.remove("red");
    pEst(t || ""); micLibre();
  };
  const llamarPort = async (ed, yo) => {
    if (typeof Peer === "undefined") return pEst("No se pudo cargar la llamada.", "err");
    try { if (!stream) stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { return pEst("Necesitás dar permiso de micrófono.", "err"); }
    pActiva = true;
    $("llamarPort").textContent = `Cortar llamada a ${port.unidad}`; $("llamarPort").classList.add("red");
    pEst(`Llamando a ${port.unidad}…`);
    pPeer = new Peer("portero-" + crypto.getRandomValues(new Uint32Array(3)).join(""));
    pPeer.on("open", async (pid) => {
      const link = `${BASE}?atender=${encodeURIComponent(pid)}&n=${encodeURIComponent("Llamada de " + yo.unidad + " · " + (ed.nombre || ""))}&e=${encodeURIComponent(ARCHIVO)}&u=${encodeURIComponent(port.unidad)}`;
      const q = new URLSearchParams({ title: `Llamada interna de ${yo.unidad} - ${ed.nombre || "Edificio"}`,
        priority: "urgent", tags: "telephone_receiver", actions: `view, Atender, ${link}`, click: link });
      const cuerpo = `${yo.unidad}${yo.nombre ? " (" + yo.nombre + ")" : ""} llama a ${port.unidad}` +
        (visitaActiva ? "\n🚪 Está atendiendo a una visita en la puerta" : "");
      try { const r = await fetch(`${NTFY}/${encodeURIComponent(port.topic)}?${q}`, { method: "POST", body: cuerpo }); if (!r.ok) throw 0; }
      catch { return cortarPort(`No se pudo avisar a ${port.unidad}. Revisá tu conexión.`); }
      pTimeout = setTimeout(() => cortarPort(`${port.unidad} no atendió.`), 120000);
    });
    pPeer.on("connection", (conn) => {
      clearTimeout(pTimeout); pEst("Conectando…");
      const iniciar = () => {
        // Copia del micrófono siempre activa para portería, aunque la visita esté silenciada
        pStream = new MediaStream(stream.getAudioTracks().map(t => { const c = t.clone(); c.enabled = true; return c; }));
        const c = pPeer.call(conn.peer, pStream);
        c.on("stream", (rem) => {
          const a = $("portAudio"); a.srcObject = rem; a.play().catch(() => {});
          // Mientras hablás con portería, la visita no te escucha (se puede cambiar con el botón)
          if (visitaActiva && stream.getAudioTracks()[0]?.enabled) { silencioAuto = true; micVisita(false); }
          pEst(visitaActiva ? `🟢 Hablando con ${port.unidad}. La visita no te escucha.` : `🟢 Hablando con ${port.unidad}`, "ok");
        });
        c.on("close", () => cortarPort(`${port.unidad} cortó.`));
      };
      if (conn.open) iniciar(); else conn.on("open", iniciar);
      conn.on("close", () => pActiva && cortarPort(`${port.unidad} cortó.`));
    });
    pPeer.on("error", () => cortarPort(`No se pudo conectar con ${port.unidad}.`));
  };
  (async () => {
    const u = params.get("u");
    if (!u || !$("portBox")) return;
    let ed;
    try { const r = await fetch(ARCHIVO + "?v=" + Date.now(), { cache: "no-store" }); if (!r.ok) return; ed = await r.json(); } catch { return; }
    const unidades = (ed.unidades || []).filter(x => x.topic);
    port = unidades.find(esPorteria);
    if (!port || port.unidad === u) return;          // si el que atiende es la portería, no hace falta
    const yo = unidades.find(x => x.unidad === u) || { unidad: u };
    $("portBox").classList.remove("hide");
    $("llamarPort").textContent = `📞 Llamar a ${port.unidad}`;
    $("llamarPort").onclick = () => pActiva ? cortarPort(`Cortaste la llamada a ${port.unidad}.`) : llamarPort(ed, yo);
  })();
}

const REGISTRO = "edificios.json";

// ---- GitHub: leer y guardar archivos del repo ----
const GH = (() => {
  const host = location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] : "";
  const partes = location.pathname.split("/").filter(Boolean);
  const cfg = {
    owner: LS("portero_owner") || host,
    repo: LS("portero_repo") || (partes.length > 1 ? partes[0] : (host ? host + ".github.io" : "")),
    token: LS("portero_token") || ""
  };
  const hdr = () => ({ "Authorization": "Bearer " + cfg.token, "Accept": "application/vnd.github+json" });
  const api = (p) => `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${p}`;
  const enc = s => { const b = new TextEncoder().encode(s); let r = ""; b.forEach(x => r += String.fromCharCode(x)); return btoa(r); };
  const dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));
  const fallo = (st) => new Error(st === 401 ? "Token inválido o vencido." : (st === 403 || st === 404) ? "El token no tiene permiso de escritura en este repo." : "Error " + st);

  async function leer(path) {               // → { data, sha } o null si no existe
    if (!cfg.token) {
      const r = await fetch(path + "?v=" + Date.now(), { cache: "no-store" });
      return r.ok ? { data: await r.json(), sha: null } : null;
    }
    const r = await fetch(api(path) + "?t=" + Date.now(), { headers: hdr(), cache: "no-store" });
    if (r.status === 404) return null;
    if (!r.ok) throw fallo(r.status);
    const j = await r.json();
    return { data: JSON.parse(dec(j.content)), sha: j.sha };
  }
  async function sha(path) {
    const r = await fetch(api(path) + "?t=" + Date.now(), { headers: hdr(), cache: "no-store" });
    return r.ok ? (await r.json()).sha : null;
  }
  async function guardar(path, obj, mensaje) {
    if (!cfg.token) throw new Error("Primero conectá GitHub.");
    const body = { message: mensaje, content: enc(JSON.stringify(obj, null, 2)) };
    const s = await sha(path); if (s) body.sha = s;
    const r = await fetch(api(path), { method: "PUT", headers: { ...hdr(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw fallo(r.status);
  }
  async function borrar(path, mensaje) {
    const s = await sha(path); if (!s) return;
    const r = await fetch(api(path), { method: "DELETE", headers: { ...hdr(), "Content-Type": "application/json" }, body: JSON.stringify({ message: mensaje, sha: s }) });
    if (!r.ok) throw fallo(r.status);
  }
  async function conectar(owner, repo, token) {
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}`, { headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" } });
    if (!r.ok) throw new Error(r.status === 401 ? "Token inválido." : "No encuentro ese repo con ese token.");
    const j = await r.json();
    if (j.permissions && !j.permissions.push) throw new Error("El token no tiene permiso de escritura.");
    Object.assign(cfg, { owner, repo, token });
    LS("portero_token", token); LS("portero_owner", owner); LS("portero_repo", repo);
  }
  function desconectar() { cfg.token = ""; LS("portero_token", null); }
  return { cfg, leer, guardar, borrar, conectar, desconectar };
})();

// Caja "Conexión con GitHub" (la usan las dos pantallas)
function cajaGitHub(msg) {
  const c = GH.cfg;
  return `<section class="box">

function bindGitHub(alCambiar) {
  if ($("desc")) $("desc").onclick = () => { if (confirm("¿Desconectar GitHub de este dispositivo?")) { GH.desconectar(); alCambiar(""); } };
  if ($("conectar")) $("conectar").onclick = async () => {

}

// ---- Lista de edificios (registro) ----
async function leerRegistro() {
  const reg = await GH.leer(REGISTRO).catch(e => { throw e; });
  if (reg && Array.isArray(reg.data)) return reg.data;
  // Primera vez: si ya existía un edificio.json, lo sumamos a la lista
  const viejo = await GH.leer("edificio.json").catch(() => null);
  return viejo ? [{ archivo: "edificio.json", nombre: viejo.data.nombre || "Edificio", unidades: (viejo.data.unidades || []).length }] : [];
}
const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "edificio";
const nuevoTopic = () => "portero-" + crypto.getRandomValues(new Uint32Array(3)).join("").slice(0, 18);

            <i aria-hidden="true"></i>

      </div>` : `<p style="margin:6px 0 0"><small>Todavía no hay edificios. Creá el primero.</small></p>`}
      <div class="row-actions" style="justify-content:flex-start;margin-top:14px">
        <button class="btn blue" id="nuevo" ${GH.cfg.token ? "" : "disabled"}>+ Nuevo edificio</button>
      </div>
      ${GH.cfg.token ? "" : `<small>Para crear o guardar edificios, conectá GitHub abajo.</small>`}
    </section>

  bindGitHub(m => adminLista(m));

      location.href = urlAdmin(archivo);
    } catch (e) { alert("No se pudo crear: " + e.message); adminLista(); }
  };
}

// ---- Edición de un edificio ----
async function adminEdificio(archivo) {
  let sucio = false, ed = null, msgOnline = "";
  const KEY = "portero_borrador_" + archivo;

  try { const r = await GH.leer(archivo); if (r) ed = r.data; if (GH.cfg.token) msgOnline = "✅ Conectado a GitHub."; }
  catch (e) { msgOnline = "⚠️ " + e.message; }
  try { const b = JSON.parse(LS(KEY)); if (b) { ed = b; sucio = true; } } catch {}
  if (!ed) ed = { nombre: "", direccion: "", unidades: [] };
  ed.unidades = ed.unidades || [];

  // ---- Apertura de puerta ----
  let puerta = { clave: LS("puerta_admin") || "", estado: null, msg: "" };
  const cargarPuerta = async () => {
    if (!puerta.clave) return;
    try { puerta.estado = await puertaApi({ accion: "admin_estado", admin: puerta.clave, edificio: archivo }); puerta.msg = ""; }
    catch (e) { puerta.estado = null; puerta.msg = "⚠️ " + e.message; }
  };
  await cargarPuerta();

  const limpio = () => ({ nombre: (ed.nombre || "").trim(), direccion: (ed.direccion || "").trim(),
    unidades: ed.unidades.filter(u => (u.unidad || "").trim()).map(u => ({ unidad: u.unidad.trim(), nombre: (u.nombre || "").trim(), topic: u.topic })) });

  const marcarCambio = () => {
    sucio = true; LS(KEY, JSON.stringify(ed));

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

// =====================================================================
//  MODO KIOSCO (tablet fija en la entrada): edificio.html?kiosco=1
// =====================================================================
const Kiosco = (() => {
  const on = KIOSCO;
  let timer = null, rearmar = null, ultimo = Date.now(), wake = null;
  const arrancado = Date.now();

  function cancelar() { clearTimeout(timer); timer = null; rearmar = null; }
  // Vuelve a la lista de departamentos después de "seg" segundos sin uso
  function volverEn(seg, puede) {
    if (!on) return;
    clearTimeout(timer);
    rearmar = () => { clearTimeout(timer); timer = setTimeout(() => { if (!puede || puede()) { rearmar = null; portero(); } }, seg * 1000); };
    rearmar();
  }

  if (on) {
    document.documentElement.classList.add("kiosco");
    const vp = document.querySelector('meta[name="viewport"]');
    if (vp) vp.content = "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no";
    document.addEventListener("contextmenu", e => e.preventDefault());

    // Mantener la pantalla encendida
    const pedirWake = async () => { try { if ("wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } } catch {} };
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pedirWake(); });
    pedirWake();

    // Cualquier toque: cuenta como actividad, reinicia la espera y pide pantalla completa
    const actividad = () => {
      ultimo = Date.now();
      if (rearmar) rearmar();
      pedirWake();
      const d = document.documentElement;
      if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {});
    };
    ["pointerdown", "keydown", "input"].forEach(ev => document.addEventListener(ev, actividad, { passive: true }));

    // Mantenimiento: refresca la lista cada 10 min sin uso y recarga la página cada 12 h
    setInterval(() => {
      const enLista = !!$("grid"), quieto = Date.now() - ultimo;
      if (!enLista || quieto < 120000) return;
      if (Date.now() - arrancado > 12 * 3600e3) location.reload();
      else if (quieto > 600000) { ultimo = Date.now(); portero(); }
    }, 60000);
  }
  return { on, cancelar, volverEn };
})();


// =====================================================================
//  CARA + PIN en la tablet (edificio.html?kiosco=1&k=CLAVE_DE_TABLET)
//  La cara solo identifica al propietario: para abrir siempre se pide el PIN.
// =====================================================================
const FACE_LIB = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1/dist/face-api.js";
const FACE_MODELS = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1/model/";
const PLACA_TOP = '<div class="plate-top"><span class="led" aria-hidden="true"></span><span class="grille" aria-hidden="true"></span></div>';
const dormir = ms => new Promise(r => setTimeout(r, ms));

const Caras = (() => {
  let listo = null, stream = null, loopT = null, pausaHasta = 0, ocupado = false;

  function cargar() {
    if (listo) return listo;
    listo = new Promise((res, rej) => {
      if (window.faceapi) return res();
      const s = document.createElement("script"); s.src = FACE_LIB; s.onload = res; s.onerror = () => rej(new Error("No se pudo cargar el reconocimiento facial."));
      document.head.appendChild(s);
    }).then(() => Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS),
      faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODELS),
      faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODELS),
    ]));
    listo.catch(() => { listo = null; });
    return listo;
  }
  async function camara(video) {
    if (!stream || !stream.active) stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 } }, audio: false });
    video.srcObject = stream; await video.play().catch(() => {});
    if (!video.videoWidth) await new Promise(r => video.onloadedmetadata = r);
  }
  function parar() { clearTimeout(loopT); loopT = null; if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
  const pausar = ms => { pausaHasta = Date.now() + ms; };

  // Lee una cara del video. minAncho: qué tan cerca tiene que estar (fracción del ancho)
  async function leer(video, minAncho) {
    const det = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }))
      .withFaceLandmarks().withFaceDescriptor();
    if (!det) return null;
    if (det.detection.box.width / (video.videoWidth || 1) < minAncho) return { lejos: true };
    return { d: Array.from(det.descriptor) };
  }

  // Pantalla de departamentos: mira la cámara y avisa cuando reconoce a un propietario
  async function vigilar(video, alEstado, alReconocer) {
    clearTimeout(loopT);
    try { await cargar(); await camara(video); } catch (e) { alEstado("error"); return; }
    alEstado("listo");
    const paso = async () => {
      if (!video.isConnected) return;
      if (Date.now() >= pausaHasta && !ocupado && !document.querySelector(".overlay")) {
        try {
          const r = await leer(video, 0.2);
          if (r && r.lejos) alEstado("lejos");
          else if (r && r.d) {
            ocupado = true; alEstado("buscando");
            const res = await puertaApi({ accion: "identificar", edificio: ARCHIVO, k: KTOKEN, descriptor: r.d }).catch(() => null);
            ocupado = false;
            if (res && res.unidad) { pausar(20000); alEstado("listo"); alReconocer(res.unidad); }
            else { pausar(3000); alEstado("desconocido"); }
          } else alEstado("listo");
        } catch { ocupado = false; }
      }
      loopT = setTimeout(paso, 500);
    };
    paso();
  }

  // Registro: junta 5 lecturas parecidas y devuelve el promedio
  async function capturar(video, alProgreso) {
    const m = [];
    for (let i = 0; i < 50 && m.length < 5; i++) {
      const r = await leer(video, 0.18).catch(() => null);
      if (r && r.d) { m.push(r.d); alProgreso(m.length, false); } else alProgreso(m.length, !!(r && r.lejos));
      await dormir(300);
    }
    if (m.length < 5) return null;
    const prom = m[0].map((_, i) => m.reduce((s, v) => s + v[i], 0) / m.length);
    const dist = (a, b) => Math.sqrt(a.reduce((s, x, i) => s + (x - b[i]) ** 2, 0));
    return m.every(v => dist(v, prom) < 0.45) ? prom : null;
  }
  return { cargar, camara, parar, pausar, vigilar, capturar };
})();

// Teclado numérico en pantalla para el PIN
function teclado(cont, alConfirmar, textoOk = "Abrir") {
  let v = "";
  cont.innerHTML = `<div class="pinDots" aria-live="polite"></div>
    <div class="keypad">${["1","2","3","4","5","6","7","8","9","⌫","0","ok"].map(k =>
      `<button type="button" class="key${k === "ok" ? " ok" : ""}" data-k="${k}">${k === "ok" ? textoOk : k}</button>`).join("")}</div>`;
  const dots = cont.querySelector(".pinDots");
  const pintar = () => { dots.textContent = v ? "●".repeat(v.length) : "Ingresá tu PIN"; dots.classList.toggle("vacio", !v); };
  pintar();
  cont.querySelectorAll(".key").forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k === "⌫") v = v.slice(0, -1);
    else if (k === "ok") { if (v.length >= 4) alConfirmar(v); }
    else if (v.length < 8) v += k;
    pintar();
  });
  return { limpiar() { v = ""; pintar(); }, bloquear(si) { cont.querySelectorAll(".key").forEach(b => b.disabled = si); } };
}

// Propietario reconocido: "Hola" + PIN para abrir
function holaPropietario(ed, unidad) {
  if (document.querySelector(".overlay")) return;
  const u = (ed.unidades || []).find(x => x.unidad === unidad) || { unidad };
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<section class="plate" role="dialog" aria-label="Abrir la puerta">
      ${PLACA_TOP}
      <div class="nameplate"><small>Hola</small><strong>${esc(u.nombre || u.unidad)}</strong></div>
      <p class="sub">${u.nombre ? esc(u.unidad) + ". " : ""}Ingresá tu PIN para abrir la puerta.</p>
      <div class="kp"></div>
      <div class="status" role="status" aria-live="polite"></div>
      <button type="button" class="btn ghost noSoy">No soy yo</button>
    </section>`;
  document.body.appendChild(ov);
  const st = ov.querySelector(".status");
  let t;
  const cerrar = () => { clearTimeout(t); ov.remove(); Caras.pausar(6000); };
  const reiniciarEspera = () => { clearTimeout(t); t = setTimeout(cerrar, 25000); };
  reiniciarEspera();
  ov.addEventListener("pointerdown", reiniciarEspera);
  ov.querySelector(".noSoy").onclick = cerrar;
  const kp = teclado(ov.querySelector(".kp"), async (pin) => {
    kp.bloquear(true); st.className = "status"; st.textContent = "Abriendo…";
    try {
      await puertaApi({ accion: "abrir", edificio: ARCHIVO, unidad: u.unidad, pin, k: KTOKEN });
      st.className = "status ok"; st.textContent = "🔓 Puerta abierta. ¡Bienvenido!";
      Caras.pausar(30000); setTimeout(cerrar, 3500);
    } catch (e) {
      st.className = "status err"; st.textContent = e.message; kp.limpiar(); kp.bloquear(false);
      if (e.status === 429) setTimeout(cerrar, 4000);
    }
  });
}

// Registro de la cara de un propietario (en la tablet, con su PIN)
function registrarCara(ed) {
  Kiosco.volverEn(90);
  const unidades = (ed.unidades || []).filter(u => u.topic);
  app.innerHTML = `
    <button class="back" id="volver" style="color:#d9e6e9">← Volver</button>
    <section class="plate">
      ${PLACA_TOP}
      <div class="nameplate"><small>Propietarios</small><strong>Registrar mi cara</strong></div>
      <div id="paso"></div>
    </section>`;
  $("volver").onclick = () => portero();
  const paso = $("paso");

  // 1) elegir departamento
  paso.innerHTML = `<p class="sub" style="margin:12px 0 0">¿En qué departamento vivís?</p>
    <div class="directory">${unidades.map((u, i) => `<button class="unit" data-i="${i}"><b>${esc(u.unidad)}</b><span>${esc(u.nombre || "")}</span><i aria-hidden="true"></i></button>`).join("")}</div>`;
  paso.querySelectorAll(".unit").forEach(b => b.onclick = () => pedirPin(unidades[+b.dataset.i]));

  // 2) PIN + consentimiento
  function pedirPin(u) {
    paso.innerHTML = `<p class="sub" style="margin:12px 0 4px">${esc(u.unidad)}: ingresá tu PIN de apertura.</p>
      <label class="check" style="margin:8px 0 10px;text-align:left"><input type="checkbox" id="acepto">
        Acepto que se guarde un patrón de mi cara para reconocerme en esta puerta. Puedo pedir que lo borren cuando quiera.</label>
      <div class="kp"></div><div class="status" id="rst"></div>`;
    const kp = teclado(paso.querySelector(".kp"), (pin) => {
      if (!$("acepto").checked) { $("rst").className = "status err"; $("rst").textContent = "Marcá la casilla para continuar."; return; }
      sacarFoto(u, pin);
    }, "Seguir");
  }

  // 3) captura
  async function sacarFoto(u, pin) {
    paso.innerHTML = `<p class="sub" style="margin:12px 0 0">Mirá a la cámara, a un brazo de distancia, sin anteojos de sol ni gorra.</p>
      <div class="screen"><video id="rvid" autoplay playsinline muted class="espejo"></video></div>
      <div class="status" id="rst">Preparando la cámara…</div>`;
    try { await Caras.cargar(); await Caras.camara($("rvid")); }
    catch { $("rst").className = "status err"; $("rst").textContent = "No se pudo usar la cámara."; return; }
    const d = await Caras.capturar($("rvid"), (n, lejos) => {
      if (!$("rst")) return;
      $("rst").className = "status"; $("rst").textContent = lejos ? "Acercate un poco más." : `Leyendo tu cara… ${n} de 5`;
    });
    if (!$("rst")) return;
    if (!d) { $("rst").className = "status err"; $("rst").innerHTML = `No pudimos leer bien tu cara. <button class="btn sm" id="otra">Probar de nuevo</button>`; $("otra").onclick = () => sacarFoto(u, pin); return; }
    $("rst").className = "status"; $("rst").textContent = "Guardando…";
    try {
      await puertaApi({ accion: "registrar_cara", edificio: ARCHIVO, k: KTOKEN, unidad: u.unidad, pin, descriptor: d });
      paso.innerHTML = `<p class="status ok" style="margin-top:16px">✅ Listo. La próxima vez acercate a la tablet y te va a reconocer.</p>`;
      Kiosco.volverEn(6);
    } catch (e) {
      $("rst").className = "status err"; $("rst").textContent = e.message;
      if (e.status === 401 || e.status === 400) { setTimeout(() => pedirPin(u), 2000); }
    }
  }
}


// ---- Arranque (al final, cuando todo está definido) ----
if (params.has("admin")) (params.get("e") ? adminEdificio(ARCHIVO) : adminLista());
else if (params.get("atender")) atender();
else if (params.has("vecino")) vecinoPantalla();
else portero();
</script>
